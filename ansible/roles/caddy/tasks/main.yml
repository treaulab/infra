---
# caddy role: Caddy is the only service (front door + static website).
# Ships Caddyfile + website src + .env, then brings the stack up.
- name: Ensure deploy root
  file:
    path: "{{ deploy_root }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - apps/caddy
    - apps/website/src

- name: Deploy Caddyfile
  copy:
    src: "{{ playbook_dir }}/../../apps/caddy/Caddyfile"
    dest: "{{ deploy_root }}/apps/caddy/Caddyfile"
    mode: "0644"
  notify: Restart caddy

- name: Deploy website source
  copy:
    src: "{{ playbook_dir }}/../../apps/website/src/"
    dest: "{{ deploy_root }}/apps/website/src/"
    mode: "0644"
  notify: Restart caddy

- name: Render caddy .env (gitignored, source of truth is the inventory)
  template:
    src: env.j2
    dest: "{{ deploy_root }}/apps/caddy/.env"
    mode: "0600"
  notify: Restart caddy

- name: Bring up caddy stack
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_root }}/apps/caddy"
    state: present
    pull: always
