---
- name: Base hardening (ufw, fail2ban, unattended-upgrades, user)
  apt:
    name: [ufw, fail2ban, unattended-upgrades, curl, ca-certificates]
    state: present
    update_cache: true
# Web only: 22/80/443. SSH stays open to
# everyone here; restrict it at the NSG (tofu allowed_ssh_cidr) or change the
# source_address_prefix below to your IP.
- name: Allow OpenSSH/80/443 + deny rest
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "443"]
- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
- name: Enable unattended upgrades
  copy:
    dest: /etc/apt/apt.conf.d/51-unattended-upgrades-treaulab
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
