name: agent-bin
# Static agent binaries (bun --compile, no runtime needed on boxes).
# Tag a release:  git tag agent-v0.1.0 && git push origin agent-v0.1.0
# Bun version is pinned here AND verified locally — bump both together.
on:
  push:
    tags: [agent-v*]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            asset: tunnel-agent-linux-amd64
          - target: bun-linux-arm64
            asset: tunnel-agent-linux-arm64
    defaults:
      run:
        working-directory: workers/edge
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun --version
      - name: Compile
        run: |
          bun build --compile agent/agent.js \
            --target ${{ matrix.target }} \
            --outfile ${{ matrix.asset }}
          ls -la ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: workers/edge/${{ matrix.asset }}
          if-no-files-found: error

  smoke:
    # x64 end-to-end against local wrangler dev (no Cloudflare auth needed).
    # arm64 is compile-verified only (no arm runner here).
    runs-on: ubuntu-24.04
    needs: build
    defaults:
      run:
        working-directory: workers/edge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm install --no-audit --no-fund
      - name: Compile x64
        run: |
          bun build --compile agent/agent.js \
            --target bun-linux-x64 \
            --outfile /tmp/tunnel-agent
      - name: Sync static assets (wrangler dev needs ./public/)
        run: npm run sync:public
      - name: Smoke test (share + round-trip)
        run: |
          set -euo pipefail
          (npx wrangler dev --port 18787 > /tmp/wdev.log 2>&1 &)
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null --max-time 3 http://127.0.0.1:18787/health && break
            sleep 2
          done
          mkdir -p /tmp/up && echo ok > /tmp/up/index.html
          (python3 -m http.server 18102 --bind 127.0.0.1 --directory /tmp/up &)
          sleep 2
          (timeout 60 /tmp/tunnel-agent http://127.0.0.1:18102 \
            --host http://127.0.0.1:18787 --json > /tmp/share.log 2>&1 &)
          sleep 6
          ID=$(head -n 1 /tmp/share.log | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          test "$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://127.0.0.1:18787/t/$ID/")" = "200"
      - name: Dump dev/agent logs on failure
        if: failure()
        run: |
          echo "--- /tmp/wdev.log ---"
          cat /tmp/wdev.log 2>/dev/null || echo "(missing)"
          echo "--- /tmp/share.log ---"
          cat /tmp/share.log 2>/dev/null || echo "(missing)"

  release:
    runs-on: ubuntu-24.04
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/agent-v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      # gh CLI instead of softprops/action-gh-release (node20 runtime):
      # preinstalled on runners, no JS runtime, same result.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/tunnel-agent-* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes dist/tunnel-agent-*
          fi
