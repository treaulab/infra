name: agent-bin
# Static agent binaries (bun --compile, no runtime needed on boxes).
# Tag a release:  git tag agent-v0.1.0 && git push origin agent-v0.1.0
# Bun version is pinned here AND verified locally — bump both together.
on:
  push:
    tags: [agent-v*]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.2"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            asset: tunnel-agent-linux-amd64
          - target: bun-linux-arm64
            asset: tunnel-agent-linux-arm64
    defaults:
      run:
        working-directory: workers/edge
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun --version
      - name: Compile
        run: |
          bun build --compile agent/agent.js \
            --target ${{ matrix.target }} \
            --outfile ${{ matrix.asset }}
          ls -la ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: workers/edge/${{ matrix.asset }}
          if-no-files-found: error

  smoke:
    # x64 end-to-end against local wrangler dev (no Cloudflare auth needed).
    # arm64 is compile-verified only (no arm runner here).
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: workers/edge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm install --no-audit --no-fund
      - name: Compile x64
        run: |
          bun build --compile agent/agent.js \
            --target bun-linux-x64 \
            --outfile /tmp/tunnel-agent
      - name: Smoke test (share + round-trip)
        run: |
          set -euo pipefail
          (npx wrangler dev --port 18787 > /tmp/wdev.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf -o /dev/null --max-time 3 http://127.0.0.1:18787/health && break
            sleep 2
          done
          mkdir -p /tmp/up && echo ok > /tmp/up/index.html
          (python3 -m http.server 18102 --bind 127.0.0.1 --directory /tmp/up &)
          sleep 2
          (UPSTREAM=http://127.0.0.1:18102 timeout 60 /tmp/tunnel-agent \
            --share --host http://127.0.0.1:18787 --json > /tmp/share.log 2>&1 &)
          sleep 6
          ROOM=$(head -n 1 /tmp/share.log | python3 -c "import json,sys;print(json.load(sys.stdin)['room'])")
          test "$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://127.0.0.1:18787/t/$ROOM/")" = "200"

  release:
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/agent-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/tunnel-agent-*
          generate_release_notes: true
