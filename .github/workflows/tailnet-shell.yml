# Tailnet shell: ephemeral GitHub-hosted runner joins your tailnet.
#
# Two modes, one file:
# - Hourly (schedule, cron minute 7): dummy heartbeat task holds ~1 hour
#   (~55 min loop + setup), then exits cleanly for the next run. Repeats 24/7.
#   No actor gate (schedule events have no human actor).
# - Debug (dispatch, burner ONLY andrewwang2161): join + quick filler +
#   ~17 min hold so you can `tailscale ssh` in. Gate enforced via repo
#   variable BURNER_GH_USER.
#
# - NOT on the VPS. Nothing persistent anywhere (hosted runner dies with job).
# - Tailscale SSH IN enabled (`tailscale up --ssh`); tailnet policy must
#   accept src you → dst tag:ci-ephemeral, users ["runner","root"].
# - NO ssh/scp smoke into box here (explicitly out of scope): heartbeat is
#   `tailscale ping` (L3, not SSH) + `curl https://box.treau.me/`.
# - Secrets: TS_AUTHKEY_EPHEMERAL only (tagged reusable ephemeral key).
#   No SSH_PRIVATE_KEY, no Cloudflare tokens in this workflow.
#
# Setup (repo treaulab/infra, terminal, no GUI):
#   gh secret set TS_AUTHKEY_EPHEMERAL --repo treaulab/infra   # paste tskey-auth-...
#   gh variable set BURNER_GH_USER --body andrewwang2161 --repo treaulab/infra

name: tailnet-shell

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: tailnet-shell
  cancel-in-progress: false

jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Burner gate (dispatch only, andrewwang2161)
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          BURNER: ${{ vars.BURNER_GH_USER }}
        run: |
          set -euo pipefail
          if [ -z "${BURNER:-}" ]; then
            echo "Refusing: repo variable BURNER_GH_USER is not set (want andrewwang2161)."
            exit 1
          fi
          if [ "$ACTOR" != "$BURNER" ]; then
            echo "Refusing: actor=$ACTOR is not burner ($BURNER). Ask andrewwang2161 to dispatch."
            exit 1
          fi
          echo "Burner gate PASS (actor=$ACTOR)."

      - uses: actions/checkout@v5

      - name: Install Tailscale (pinned apt, no action pin drift)
        run: |
          set -euo pipefail
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
            | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list \
            | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y tailscale
          tailscale version

      - name: Join tailnet (ephemeral, Tailscale SSH in)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY_EPHEMERAL }}
        run: |
          set -euo pipefail
          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "Refusing: repo secret TS_AUTHKEY_EPHEMERAL is not set."
            echo "Add it in Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          # Key itself must be tagged tag:ci-ephemeral + ephemeral (set in
          # Tailscale admin when the key is created). Hostname is per-run so
          # each run shows as gh-ci-<run-id> and vanishes on job end.
          sudo tailscale up \
            --auth-key="$TS_AUTHKEY" \
            --hostname="gh-ci-${{ github.run_id }}" \
            --accept-dns=false \
            --ssh
          tailscale status
          echo "--- tailnet IPv4 (ssh in with: tailscale ssh runner@gh-ci-${{ github.run_id }}) ---"
          tailscale ip -4

      # Dispatch filler: one quick check, then the hold below.
      - name: Filler — tailnet ping + edge HTTP (no SSH smoke)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tailscale ping --c 3 box || echo "(ping box failed — is the NAT box on the tailnet as 'box'?)"
          curl -sI --max-time 10 https://box.treau.me/ | head -5 || echo "(curl box.treau.me failed — ok while tunnel/DNS still settling)"

      - name: Hold window open (dispatch debug use, then self-destruct)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Alive for ~17 more minutes."
          echo "From your tailnet machine: tailscale ssh runner@gh-ci-${{ github.run_id }}"
          echo "Job hard-kills at 75 min ceiling; node auto-vanishes (ephemeral key)."
          sleep 1050

      # Dummy hourly task (schedule only): heartbeat loop ~55 min so the run
      # lasts about an hour total with setup, then exits for the next cycle.
      # Dummy work: timestamped heartbeats + ping + edge HTTP status.
      - name: Dummy hourly task (hold ~1h, heartbeat, no exit till done)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          START=$(date +%s)
          END=$((START + 3300))
          i=0
          echo "dummy-task start $(date -u +%FT%TZ) run_id=${{ github.run_id }} (holding ~55 min)"
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i + 1))
            STAMP=$(date -u +%FT%TZ)
            PING=$(tailscale ping --c 1 box 2>&1 | tail -1 || echo "ping-fail")
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://box.treau.me/ || echo "curl-fail")
            echo "heartbeat $i $STAMP ping=[$PING] http=[$CODE]"
            sleep 300
          done
          echo "dummy-task done after $i heartbeats $(date -u +%FT%TZ) — exiting for next hourly run"
