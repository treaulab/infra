name: deploy
# Production CD for the MAIN server: converge Caddy + static site on the Azure
# VPS with Ansible. The Worker and homelab are not in this path.
on:
  push:
    branches: [main]
    paths:
      - stacks/public/**
      - fleet/playbooks/deploy-public.yml
      - fleet/playbooks/templates/**
      - fleet/requirements.yml
      - tools/deploy-public.sh
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Serialize deploys; queue instead of cancelling a mid-flight release.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ansible tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core
          ansible-galaxy collection install -r fleet/requirements.yml
      - name: Build inventory + key from secrets (fail fast if missing)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DOMAIN: ${{ secrets.SITE_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        run: |
          set -euo pipefail
          missing=""
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY DOMAIN ACME_EMAIL; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Deploy secrets not set:$missing — add them in repo Settings → Secrets and variables → Actions. This is the production deploy path for treau.me (Azure VPS)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > fleet/inventory/ci.yml <<EOF
          all:
            vars:
              domain: ${DOMAIN}
              acme_email: ${ACME_EMAIL}
              caddy_version: "2.11"
              deploy_root: /opt/treaulab
              site_ip: ${SSH_HOST}
            children:
              edge:
                hosts:
                  vps:
                    ansible_host: ${SSH_HOST}
                    ansible_user: ${SSH_USER}
                    ansible_ssh_private_key_file: ${HOME}/.ssh/deploy
          EOF
      - name: Deploy over SSH
        working-directory: fleet
        run: ansible-playbook -i inventory/ci.yml playbooks/deploy-public.yml --limit vps
