name: deploy
# Production CD for the main server: converge Caddy + static site on the Azure
# VPS with Ansible. The Worker and homelab are not in this path.
on:
  push:
    branches: [main]
    paths:
      - stacks/edge/**
      - fleet/playbooks/compose.yml
      - fleet/playbooks/site.yml
      - fleet/roles/compose_stack/**
      - fleet/group_vars/edge.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fleet/requirements.txt
      - name: Install Ansible tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r fleet/requirements.txt
      - name: Ensure inventory exists
        working-directory: fleet
        run: "[[ -f inventory/prod.yml ]] || cp inventory/prod.yml.example inventory/prod.yml"
      - name: Syntax-check compose playbook
        working-directory: fleet
        run: ansible-playbook -i inventory/prod.yml playbooks/compose.yml --syntax-check
      - name: Validate Caddy compose config
        working-directory: stacks/edge/caddy
        run: |
          caddy_env=.env
          [[ -f "$caddy_env" ]] || caddy_env=.env.example
          docker compose --env-file "$caddy_env" config --quiet
      - name: Validate Caddyfile syntax
        run: |
          caddy_env=stacks/edge/caddy/.env
          [[ -f "$caddy_env" ]] || caddy_env=stacks/edge/caddy/.env.example
          docker run --rm --network none --entrypoint caddy \
            --env-file "$caddy_env" \
            -v "$PWD/stacks/edge/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            docker.io/library/caddy:2.11 validate --config /etc/caddy/Caddyfile

  deploy:
    name: deploy
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ secrets.SITE_DOMAIN || 'treau.me' }}
    # Serialize deploys; queue instead of cancelling a mid-flight release.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fleet/requirements.txt
      - name: Install Ansible tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r fleet/requirements.txt
      - name: Configure SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY is not set — add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          if [ -n "${SSH_HOST:-}" ]; then
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            chmod 600 ~/.ssh/known_hosts
          fi
      - name: Deploy with Ansible
        working-directory: fleet
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ansible-playbook -i inventory/prod.yml playbooks/compose.yml \
            --limit vps \
            ${SSH_HOST:+-e ansible_host="$SSH_HOST"} \
            ${SSH_USER:+-e ansible_user="$SSH_USER"} \
            -e ansible_ssh_private_key_file="$HOME/.ssh/deploy"
