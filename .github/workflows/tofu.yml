name: tofu
on:
  pull_request:
    paths: [tofu/**]
  push:
    branches: [main]
    paths: [tofu/**]
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
      - working-directory: tofu
        run: |
          tofu init -backend=false
          tofu fmt -check
          tofu validate

  # Learning root: tailnet policy + per-account keys + spoke secrets.
  # Plan/validate only (no credentials in CI) — applies are human, terminal,
  # short-lived env (see tofu/tailnet/README.md). Never auto-apply: state
  # holds live key material.
  plan-tailnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
      - working-directory: tofu/tailnet
        run: |
          tofu init -backend=false
          tofu fmt -check
          tofu validate

  # Governance root: branch protection (no secret material — safe in state).
  # Same posture: plan/validate in CI, applies human with admin PAT
  # (see tofu/github/README.md).
  plan-github:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
      - working-directory: tofu/github
        run: |
          tofu init -backend=false
          tofu fmt -check
          tofu validate
