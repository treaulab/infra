name: tofu
on:
  pull_request:
    paths: [platform/**]
  push:
    branches: [main]
    paths: [platform/**]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        root: [azure, cloudflare, github, tailscale]
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v2
      - name: Init, fmt, validate (${{ matrix.root }})
        working-directory: platform/${{ matrix.root }}
        run: |
          tofu init -backend=false
          tofu fmt -check -recursive
          tofu validate

  # Applies are human, terminal, short-lived credentials. CI never applies:
  # tailscale state holds live key material; azure state controls the VPS.
