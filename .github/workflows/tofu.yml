name: tofu
on:
  pull_request:
    paths: [tofu/**]
  push:
    branches: [main]
    paths: [tofu/**]
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - working-directory: tofu
        run: |
          tofu init -backend=false
          tofu fmt -check
          tofu validate
