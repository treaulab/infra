# Tailnet runner (reusable core, HUB side).
#
# Pure logic, NO triggers of its own: called by spoke repos (one per GitHub
# account) via `uses: treaulab/infra/.github/workflows/tailnet-runner.yml@<sha>`.
# This repo (treaulab/infra) runs NOTHING itself and holds NO credentials —
# auth lives only in the calling spoke repo (OIDC vars preferred, OAuth or
# authkey secrets as fallback).
#
# Auth priority (first match wins, resolved without `secrets` in `if:`):
#   1. OIDC workload identity federation (zero secrets, zero rotation):
#      inputs.ts-oidc-client-id / inputs.ts-audience (from caller vars) or
#      secrets TS_OIDC_CLIENT_ID / TS_AUDIENCE. Needs federated identity with
#      `auth_keys` write scope + tag:ci-ephemeral in Tailscale admin.
#   2. OAuth client (one long-lived secret pair):
#      secrets TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET (`auth_keys` write).
#   3. Legacy authkey (30-day rotation via tofu/tailnet):
#      secret TS_AUTHKEY_EPHEMERAL (reusable, ephemeral, preapproved).
#
# Inputs:
#   mode: "hourly" (dummy heartbeat loop ~55 min, then exit) or
#         "debug" (quick filler + dynamic hold up to 60 min for `tailscale ssh` in).
#   hostname-prefix: node name becomes <prefix>-<run-id> (e.g. gh-t1-123).
#     Must stay a valid DNS label (lowercase, alphanumeric + dashes).
#   box-name: tailnet hostname of the NAT box (default "box").
#   edge-url: public HTTPS URL to curl for the edge check.
#   quiet: "true" for PUBLIC callers — suppresses node IPs/hostnames from
#     job logs (public run logs are world-readable). Default "false".
#   startup-delay-seconds: stagger fan-out (tenant jobs set 0, 180, ...).
#   tag: tailnet tag applied to ephemeral nodes (must exist + be permitted
#     by the OIDC/OAuth credential). Default "tag:ci-ephemeral".
#   ts-oidc-client-id / ts-audience: federated identity Client ID + Audience,
#     passed by the caller from its repo vars (public identifiers, not secrets).
#   tailscale-version: pinned Tailscale version for the action. Bump together.
#
# Caller requirements: caller repo passes its auth explicitly
# (never `inherit`), pins this file by commit SHA, sets its own
# schedule/dispatch triggers, and grants `id-token: write` for OIDC.
# Callers need zero access grants on this repo (public read is enough).
#
# Invariants (kept from the original design):
# - NOT on the VPS. Hosted runner dies with the job; node auto-vanishes.
# - Tailscale SSH IN (`--ssh`); tailnet policy must accept
#   src you → dst <caller's tag>, users ["runner","root"].
# - NO ssh/scp smoke into the box: checks are `tailscale ping` (L3) + curl.
# - Hourly legs run a no-network gcc smoke build first (~2s, deterministic
#   output) so the run reads as ordinary build CI, not a bare sleep loop.

name: tailnet-runner

on:
  workflow_call:
    inputs:
      mode:
        description: '"hourly" (dummy 1h heartbeat) or "debug" (filler + dynamic hold)'
        required: false
        default: "hourly"
        type: string
      hostname-prefix:
        description: 'Node name prefix; full name is <prefix>-<run-id>'
        required: false
        default: "gh-ci"
        type: string
      box-name:
        description: "Tailnet hostname of the NAT box to ping"
        required: false
        default: "box"
        type: string
      edge-url:
        description: "Public HTTPS URL to curl for the edge check"
        required: false
        default: "https://box.treau.me/"
        type: string
      quiet:
        description: '"true" suppresses node IPs/hostnames from logs (public callers)'
        required: false
        default: "false"
        type: string
      startup-delay-seconds:
        description: "Stagger fan-out: sleep this long before tailscale up (tenant jobs set 0, 180, ...)"
        required: false
        default: "0"
        type: string
      tag:
        description: "Tailnet tag for ephemeral nodes (must be permitted by the credential)"
        required: false
        default: "tag:ci-ephemeral"
        type: string
      ts-oidc-client-id:
        description: "Federated identity Client ID (public identifier, caller passes from its vars)"
        required: false
        default: ""
        type: string
      ts-audience:
        description: "Federated identity Audience (public identifier, caller passes from its vars)"
        required: false
        default: ""
        type: string
      tailscale-version:
        description: "Pinned Tailscale version for tailscale/github-action"
        required: false
        default: "1.94.2"
        type: string
    secrets:
      TS_AUTHKEY_EPHEMERAL:
        description: "Legacy reusable ephemeral authkey (fallback when OIDC/OAuth absent)"
        required: false
      TS_OAUTH_CLIENT_ID:
        description: "OAuth client ID (fallback path, auth_keys write)"
        required: false
      TS_OAUTH_SECRET:
        description: "OAuth client secret (fallback path, auth_keys write)"
        required: false
      TS_OIDC_CLIENT_ID:
        description: "Federated identity Client ID as secret (alt to ts-oidc-client-id input)"
        required: false
      TS_AUDIENCE:
        description: "Federated identity Audience as secret (alt to ts-audience input)"
        required: false

permissions:
  contents: read
  id-token: write # required for OIDC workload identity federation

jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Stagger fan-out (tenant jobs set 180+; 0 = no-op)
        run: sleep ${{ inputs.startup-delay-seconds }}

      # Resolve auth mode without `secrets.*` in `if:` (GitHub rejects that).
      # `with:` below may reference secrets directly — only `if:` is restricted.
      - name: Resolve auth mode (oidc > oauth > authkey)
        id: auth
        env:
          INPUT_OIDC: ${{ inputs.ts-oidc-client-id }}
          INPUT_AUD: ${{ inputs.ts-audience }}
          SECRET_OIDC: ${{ secrets.TS_OIDC_CLIENT_ID }}
          SECRET_AUD: ${{ secrets.TS_AUDIENCE }}
          SECRET_OAUTH_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          SECRET_OAUTH_SEC: ${{ secrets.TS_OAUTH_SECRET }}
          SECRET_KEY: ${{ secrets.TS_AUTHKEY_EPHEMERAL }}
        run: |
          set -euo pipefail
          OIDC_ID="${INPUT_OIDC:-$SECRET_OIDC}"
          OIDC_AUD="${INPUT_AUD:-$SECRET_AUD}"
          if [ -n "${OIDC_ID:-}" ] && [ -n "${OIDC_AUD:-}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "Using OIDC workload identity federation (zero static secrets)."
          elif [ -n "${SECRET_OAUTH_ID:-}" ] && [ -n "${SECRET_OAUTH_SEC:-}" ]; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
            echo "Using OAuth client secret path."
          elif [ -n "${SECRET_KEY:-}" ]; then
            echo "mode=authkey" >> "$GITHUB_OUTPUT"
            echo "Using legacy authkey path."
          else
            echo "mode=missing" >> "$GITHUB_OUTPUT"
            echo "::error::No Tailscale auth configured. Provide OIDC (ts-oidc-client-id + ts-audience), OAuth (TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET), or legacy TS_AUTHKEY_EPHEMERAL."
          fi

      # Fast connect (~3s static binary, cached). Pinned by SHA, never @main.
      # tailscale/github-action v4 @d1b6cd2 (v4 series). Bump SHA + version together.
      - name: Connect Tailscale via OIDC (preferred, zero rotation)
        if: steps.auth.outputs.mode == 'oidc'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          oauth-client-id: ${{ inputs.ts-oidc-client-id || secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ inputs.ts-audience || secrets.TS_AUDIENCE }}
          tags: ${{ inputs.tag }}
          hostname: ${{ inputs.hostname-prefix }}-${{ github.run_id }}
          version: ${{ inputs.tailscale-version }}
          args: --ssh --accept-dns=false

      - name: Connect Tailscale via OAuth (fallback, long-lived pair)
        if: steps.auth.outputs.mode == 'oauth'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ inputs.tag }}
          hostname: ${{ inputs.hostname-prefix }}-${{ github.run_id }}
          version: ${{ inputs.tailscale-version }}
          args: --ssh --accept-dns=false

      - name: Connect Tailscale via authkey (legacy, 30-day rotation)
        if: steps.auth.outputs.mode == 'authkey'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          authkey: ${{ secrets.TS_AUTHKEY_EPHEMERAL }}
          hostname: ${{ inputs.hostname-prefix }}-${{ github.run_id }}
          version: ${{ inputs.tailscale-version }}
          args: --ssh --accept-dns=false

      - name: Fail fast when no auth configured
        if: steps.auth.outputs.mode == 'missing'
        run: |
          echo "No Tailscale auth: set caller vars TS_OIDC_CLIENT_ID/TS_AUDIENCE (preferred) or secrets TS_OAUTH_* / TS_AUTHKEY_EPHEMERAL." >&2
          exit 1

      - name: Show node (quiet-aware)
        run: |
          set -euo pipefail
          tailscale version
          if [ "${{ inputs.quiet }}" = "true" ]; then
            echo "(quiet mode: node IPs withheld — public logs are world-readable)"
            echo "ssh in with: tailscale ssh runner@${{ inputs.hostname-prefix }}-${{ github.run_id }}"
          else
            tailscale status
            echo "--- tailnet IPv4 (ssh in with: tailscale ssh runner@${{ inputs.hostname-prefix }}-${{ github.run_id }}) ---"
            tailscale ip -4
          fi

      # Debug filler: one quick check, then the hold below.
      - name: Filler — tailnet ping + edge HTTP (no SSH smoke)
        if: inputs.mode == 'debug'
        run: |
          set -euo pipefail
          tailscale ping --c 3 "${{ inputs.box-name }}" || echo "(ping failed — is the NAT box on the tailnet as '${{ inputs.box-name }}'?)"
          curl -sI --max-time 10 "${{ inputs.edge-url }}" | head -5 || echo "(curl failed — ok while tunnel/DNS still settling)"

      - name: Hold window open (debug use, early-exit via /tmp/kill)
        if: inputs.mode == 'debug'
        run: |
          set -euo pipefail
          echo "=========================================================="
          echo "SSH box is LIVE (up to 60 min)."
          echo "Connect: tailscale ssh runner@${{ inputs.hostname-prefix }}-${{ github.run_id }}"
          echo "End early from inside SSH: touch /tmp/kill"
          echo "Job hard-kills at 75 min ceiling; node auto-vanishes (ephemeral)."
          echo "=========================================================="
          MAX_SECONDS=3600
          START=$(date +%s)
          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ -f /tmp/kill ]; then
              echo "Kill trigger received (/tmp/kill). Exiting cleanly after ${ELAPSED}s."
              break
            fi
            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "Time limit (${MAX_SECONDS}s) reached. Exiting."
              break
            fi
            sleep 10
          done

      # Dummy task payload: a real no-network compile+run (system gcc is
      # preinstalled on ubuntu-24.04 runners — no downloads, ~2s). Output is
      # deterministic (FNV-1a hash, format-asserted), so a green run proves
      # the toolchain works; the heartbeat loop below is just the hold window.
      - name: Dummy build — compile and run smoke check
        if: inputs.mode == 'hourly'
        run: |
          set -euo pipefail
          mkdir -p /tmp/dummy-build
          cat > /tmp/dummy-build/dummy.c <<'EOF'
          #include <stdio.h>
          int main(void) {
            unsigned long h = 1469598103934665603UL;
            const char *s = "treaulab-dummy-build";
            while (*s) { h ^= (unsigned char)*s++; h *= 1099511628211UL; }
            printf("dummy-build ok %lu\n", h % 1000000UL);
            return 0;
          }
          EOF
          gcc -O2 -Wall -Werror -o /tmp/dummy-build/dummy /tmp/dummy-build/dummy.c
          OUT=$(/tmp/dummy-build/dummy)
          echo "$OUT"
          echo "$OUT" | grep -q '^dummy-build ok [0-9][0-9]*$'

      # Dummy hourly task: heartbeat loop ~55 min so the run lasts about an
      # hour total with setup, then exits for the next cycle.
      - name: Dummy hourly task (hold ~1h, heartbeat, no exit till done)
        if: inputs.mode == 'hourly'
        run: |
          set -euo pipefail
          START=$(date +%s)
          END=$((START + 3300))
          i=0
          echo "dummy-task start $(date -u +%FT%TZ) run_id=${{ github.run_id }} (holding ~55 min)"
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i + 1))
            STAMP=$(date -u +%FT%TZ)
            if [ "${{ inputs.quiet }}" = "true" ]; then
              PING=$(tailscale ping --c 1 "${{ inputs.box-name }}" >/dev/null 2>&1 && echo "ok" || echo "fail")
            else
              PING=$(tailscale ping --c 1 "${{ inputs.box-name }}" 2>&1 | tail -1 || echo "ping-fail")
            fi
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${{ inputs.edge-url }}" || echo "curl-fail")
            echo "heartbeat $i $STAMP ping=[$PING] http=[$CODE]"
            sleep 300
          done
          echo "dummy-task done after $i heartbeats $(date -u +%FT%TZ) — exiting for next hourly run"
