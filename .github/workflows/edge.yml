name: edge
on:
  push:
    branches: [main]
    paths: [workers/edge/**, apps/website/src/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/edge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run sync:public
      # Manual deploys (wrangler login) are the norm; CI deploys only when the
      # repo secrets exist. Without this gate every push goes red, which trains
      # everyone to ignore CI — including the agent-bin release workflow.
      - name: Deploy to Cloudflare
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Deploy skipped (no Cloudflare secrets)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: >
          echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo
          secrets not set — edge auto-deploy skipped. Add them in
          Settings → Secrets → Actions, or deploy manually:
          npx wrangler login && npm run deploy."
