name: edge
on:
  push:
    branches: [main]
    paths: [workers/edge/**, apps/website/src/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/edge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run sync:public
      # Manual deploys (wrangler login) are the norm; CI deploys only when the
      # repo secrets exist. Without this gate every push goes red, which trains
      # everyone to ignore CI — including the agent-bin release workflow.
      # NOTE: `secrets.*` is not allowed in step `if:` (GitHub rejects the
      # whole file), so the gate lives inside the shell via env passthrough.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets not set — edge auto-deploy skipped. Add them in Settings → Secrets → Actions, or deploy manually: npx wrangler login && npm run deploy."
            exit 0
          fi
          npx wrangler deploy
