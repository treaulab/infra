# Dependabot — propose version bumps as PRs; green CI is the gate.
# Pinned things stay pinned (SHA pins, OIDC, hub SHA in spokes are out of
# scope here); this only floats what Dependabot natively tracks:
# Actions majors, Docker tags, npm in edge/tunnel-worker.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    # Path-filtered CI (tunnel/tofu/deploy/agent-bin) still runs per PR.

  - package-ecosystem: docker
    directory: /stacks/public/caddy
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    # Caddy floats on the 2.11 minor tag (patch auto-updates on next
    # `docker compose --pull always`); Dependabot watches the base-image
    # references and proposes major bumps.

  - package-ecosystem: npm
    directory: /edge/tunnel-worker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    # wrangler ^4 floats minors; Dependabot proposes majors + advisories.
