# Dependabot — propose version bumps as PRs; green CI (check.yml) is the gate.
# Pinned things stay pinned (SHA pins, OIDC, hub SHA in spokes are out of
# scope here); this floats what Dependabot natively tracks:
# Actions majors, Docker tags, npm in edge/tunnel-worker, pip in fleet, and tofu providers.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /stacks/public/caddy
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /edge/tunnel-worker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /fleet
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: terraform
    directory: /platform/azure
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: terraform
    directory: /platform/cloudflare
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: terraform
    directory: /platform/github
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: terraform
    directory: /platform/tailscale
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
