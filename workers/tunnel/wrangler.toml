"$schema" = "./node_modules/wrangler/config-schema.json"
name = "treaulab-tunnel"
main = "src/worker.js"
compatibility_date = "2026-10-11"

# Static site is the single source in apps/website/src, synced into ./public/
# by `npm run sync:public` (gitignored) before dev/deploy. Worker runs first so
# /t/* + /p/* hit the tunnel/pipe Durable Objects and everything else falls
# to assets.
[assets]
directory = "./public/"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "TUNNEL"
class_name = "TunnelRoom"

[[durable_objects.bindings]]
name = "PIPE"
class_name = "PipeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TunnelRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PipeRoom"]

# RelayRoom (old client relay) was removed from code in 97b57d0 with no
# users; delete its class so deploys stop depending on the export.
[[migrations]]
tag = "v4"
deleted_classes = ["RelayRoom"]
