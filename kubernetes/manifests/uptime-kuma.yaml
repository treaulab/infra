---
# 1. THE STORAGE (PersistentVolumeClaim)
# Uptime Kuma stores its SQLite database and config in `/app/data`.
# This requests K3s to carve out disk space on the host so your monitors
# and status pages survive pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
spec:
  accessModes:
    - ReadWriteOnce  # Mounted by one node at a time
  resources:
    requests:
      storage: 4Gi

---
# 2. THE APP (Deployment)
# Tells Kubernetes to keep exactly 1 copy of Uptime Kuma running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate  # Stop old pod before starting new one (SQLite safe)
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:1
          ports:
            - containerPort: 3001  # Internal web port
          volumeMounts:
            - name: data
              mountPath: /app/data  # Mount point inside container
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data  # Connect to the claim above

---
# 3. THE DOORWAY (Service: NodePort)
# Opens port 30001 directly on your VM's LAN IP.
# No Ingress, no reverse proxy, no complex DNS needed.
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
spec:
  type: NodePort
  selector:
    app: uptime-kuma
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001  # Access at http://192.168.10.11:30001
