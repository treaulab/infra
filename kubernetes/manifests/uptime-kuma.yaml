---
# 1. THE STORAGE (PersistentVolumeClaim)
# Uptime Kuma stores its SQLite database and config in `/app/data`.
# This requests K3s to carve out disk space on the host so your monitors
# and status pages survive pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
spec:
  accessModes:
    - ReadWriteOnce  # Mounted by one node at a time
  resources:
    requests:
      storage: 4Gi

---
# 2. THE APP (Deployment)
# Tells Kubernetes to keep exactly 1 copy of Uptime Kuma running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate  # Stop old pod before starting new one (SQLite safe)
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2
          ports:
            - containerPort: 3001  # Internal web port
          volumeMounts:
            - name: data
              mountPath: /app/data  # Mount point inside container
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data  # Connect to the claim above

---
# 3. THE DOORWAY (Service: NodePort)
# Opens port 30001 directly on your VM's LAN IP.
# Kept alongside Ingress for direct node-level fallback.
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
spec:
  type: NodePort
  selector:
    app: uptime-kuma
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001

---
# 4. THE INGRESS (Traefik L7 Reverse Proxy)
# Routes traffic coming to Traefik directly to Uptime Kuma.
# Matches any host on port 80 or 'kuma.lan'.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: kuma.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
