---
# kubernetes/minecraft/manifests/homepage.yaml
# Class Lab Homepage Dashboard deployed on the standalone minecraft cluster.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: default

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
data:
  settings.yaml: |
    title: "Class Lab Hub"
    theme: "dark"
    color: "slate"
    headerStyle: "boxed"
    cardBlur: "sm"
    layout:
      Class Portals:
        style: "row"
        columns: 5

  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank

    # Live Digital Clock (essential for timed labs / exams)
    - datetime:
        text_size: 2xl
        format:
          timeStyle: short
          dateStyle: medium
          hour12: true

  services.yaml: |
    - Class Portals:
        - duckling.ai:
            icon: openai
            href: "https://duckling.ai"
            description: "Local AI Platform"
            ping: "https://duckling.ai"

        - ctf.com:
            icon: ctfd
            href: "http://duckling.ctf.com"
            description: "Cybersecurity CTF Challenges"
            ping: "http://duckling.ctf.com"

        - netlab.pccsk12.com:
            icon: cisco
            href: "https://netlab.pccsk12.com"
            description: "PCCSK12 Networking & Cyber Lab"
            ping: "https://netlab.pccsk12.com"

        - exam.duckling.local:
            icon: windows
            href: "https://exam.duckling.local"
            description: "Online Exam & Testing Portal"
            ping: "https://exam.duckling.local"

        - Status & Uptime:
            icon: uptime-kuma
            href: "http://status.class.net/status/default"
            description: "DuckPond Fleet & Service Health"
            widget:
              type: uptimekuma
              url: "http://uptime-kuma:3001"
              slug: "default"

  bookmarks.yaml: |
    - CompTIA & Security Frameworks:
        - MITRE ATT&CK Matrix:
            - abbr: ATT&CK
              href: https://attack.mitre.org/
        - NIST Cybersecurity Framework:
            - abbr: NIST
              href: https://www.nist.gov/cyberframework
        - Common Ports & Protocols:
            - abbr: PORT
              href: https://packetlife.net/library/cheat-sheets/
        - OWASP Top 10:
            - abbr: OWASP
              href: https://owasp.org/www-project-top-ten/
        - CompTIA Exam Objectives:
            - abbr: COMP
              href: https://www.comptia.org/certifications

    - Cyber Tools & Reference:
        - CyberChef (Crypto & Decoding):
            - abbr: CHEF
              href: https://gchq.github.io/CyberChef/
        - Wireshark Display Filters:
            - abbr: SHARK
              href: https://www.wireshark.org/docs/dfref/
        - Nmap Network Scanning Manual:
            - abbr: NMAP
              href: https://nmap.org/book/man.html
        - Exploit Database & CVEs:
            - abbr: CVE
              href: https://www.exploit-db.com/
        - ExplainShell (Linux Command Manual):
            - abbr: BASH
              href: https://explainshell.com/

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      hostAliases:
        - ip: "192.168.10.76"
          hostnames:
            - "duckling.ctf.com"
            - "minecraft.duckling.local"
            - "minecraft.host"
        - ip: "192.168.10.70"
          hostnames:
            - "exam.duckling.local"
        - ip: "10.7.13.3"
          hostnames:
            - "netlab.pccsk12.com"
        - ip: "192.168.10.68"
          hostnames:
            - "duckling.ai"
        - ip: "192.168.10.77"
          hostnames:
            - "status.class.net"
            - "class.net"
            - "class"
      initContainers:
        - name: init-config
          image: ghcr.io/gethomepage/homepage:latest
          command: ["sh", "-c", "cp /config-templates/* /app/config/"]
          volumeMounts:
            - name: config-templates
              mountPath: /config-templates
            - name: config-dir
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          volumeMounts:
            - name: config-dir
              mountPath: /app/config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config-templates
          configMap:
            name: homepage-config
        - name: config-dir
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: homepage

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: class
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
    - host: class.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
    - host: "*.class.net"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
    - host: "*.lan"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
    - host: class.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
    - host: duckling.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
