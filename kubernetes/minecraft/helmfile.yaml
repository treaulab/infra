# kubernetes/minecraft/helmfile.yaml — Declarative Helm releases for minecraft cluster.

repositories:
  - name: metallb
    url: https://metallb.github.io/metallb

releases:
  - name: metallb
    namespace: metallb-system
    chart: metallb/metallb
    version: 0.16.2
    createNamespace: true
    values:
      - ../values/metallb.yaml
