---
# roles/openwrt_gateway/tasks/main.yml — OpenWrt Gateway Convergence.

- name: Check if python3 is installed on OpenWrt
  ansible.builtin.raw: which python3 || true
  register: python3_check
  changed_when: false

- name: Install python3 via apk if missing
  ansible.builtin.raw: apk update && apk add python3-light python3-urllib
  when: python3_check.stdout | trim == ''

- name: Update apk package repositories cache
  ansible.builtin.command:
    cmd: apk update
  changed_when: false

- name: Install required OpenWrt packages via apk
  ansible.builtin.command:
    cmd: apk add kmod-nfnetlink-queue kmod-nft-queue libnetfilter-queue1 luajit2 tinyproxy luci-ssl
  register: apk_install
  changed_when: "'Installing' in apk_install.stdout or 'Upgrading' in apk_install.stdout"

- name: Ensure sysctl.d directory exists
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    mode: "0755"

- name: Deploy kernel sysctl parameters
  ansible.builtin.copy:
    src: sysctl.conf
    dest: /etc/sysctl.conf
    mode: "0644"
  notify: Apply sysctl

- name: Deploy proxy tuning sysctl parameters
  ansible.builtin.copy:
    src: 99-proxy-tuning.conf
    dest: /etc/sysctl.d/99-proxy-tuning.conf
    mode: "0644"
  notify: Apply sysctl

- name: Deploy UCI network configuration
  ansible.builtin.template:
    src: network.j2
    dest: /etc/config/network
    mode: "0644"
  notify: Reload network

- name: Deploy UCI firewall configuration
  ansible.builtin.copy:
    src: firewall
    dest: /etc/config/firewall
    mode: "0644"
  notify: Restart firewall

- name: Deploy UCI tinyproxy configuration
  ansible.builtin.template:
    src: tinyproxy.j2
    dest: /etc/config/tinyproxy
    mode: "0644"
  notify: Restart tinyproxy

- name: Deploy UCI dhcp/dnsmasq configuration
  ansible.builtin.copy:
    src: dhcp
    dest: /etc/config/dhcp
    mode: "0644"
  notify: Restart dnsmasq

- name: Ensure /opt directory exists
  ansible.builtin.file:
    path: /opt
    state: directory
    mode: "0755"

- name: Check if Zapret2 binary already exists
  ansible.builtin.stat:
    path: /opt/zapret2/nfq2/nfqws2
  register: zapret2_bin_stat

- name: Download Zapret2 release from GitHub mirror
  ansible.builtin.get_url:
    url: "{{ openwrt_zapret_url }}"
    dest: /tmp/zapret2-release.tar.gz
    mode: "0644"
  when: not zapret2_bin_stat.stat.exists

- name: Extract Zapret2 release to /opt
  ansible.builtin.unarchive:
    src: /tmp/zapret2-release.tar.gz
    dest: /opt
    remote_src: true
    creates: /opt/zapret2/nfq2/nfqws2
  when: not zapret2_bin_stat.stat.exists

- name: Clean up temporary Zapret2 release archive
  ansible.builtin.file:
    path: /tmp/zapret2-release.tar.gz
    state: absent
  when: not zapret2_bin_stat.stat.exists

- name: Deploy Zapret2 configuration
  ansible.builtin.template:
    src: zapret2-config.j2
    dest: /opt/zapret2/config
    mode: "0644"
  notify: Restart zapret2

- name: Ensure Zapret2 ipset directory exists
  ansible.builtin.file:
    path: /opt/zapret2/ipset
    state: directory
    mode: "0755"

- name: Deploy Zapret2 IP exclusions
  ansible.builtin.template:
    src: zapret-ip-exclude.txt.j2
    dest: /opt/zapret2/ipset/zapret-ip-exclude.txt
    mode: "0644"
  notify: Restart zapret2

- name: Deploy Zapret2 host exclusions
  ansible.builtin.template:
    src: zapret-hosts-user-exclude.txt.j2
    dest: /opt/zapret2/ipset/zapret-hosts-user-exclude.txt
    mode: "0644"
  notify: Restart zapret2

- name: Symlink Zapret2 init script
  ansible.builtin.file:
    src: /opt/zapret2/init.d/openwrt/zapret2
    dest: /etc/init.d/zapret2
    state: link

- name: Ensure hotplug interface directory exists
  ansible.builtin.file:
    path: /etc/hotplug.d/iface
    state: directory
    mode: "0755"

- name: Symlink Zapret2 hotplug script
  ansible.builtin.file:
    src: /opt/zapret2/init.d/openwrt/90-zapret2
    dest: /etc/hotplug.d/iface/90-zapret2
    state: link

- name: Enable OpenWrt services
  ansible.builtin.command:
    cmd: "/etc/init.d/{{ item }} enable"
  loop:
    - tinyproxy
    - zapret2
    - dnsmasq
  changed_when: false

- name: Start OpenWrt services
  ansible.builtin.command:
    cmd: "/etc/init.d/{{ item }} start"
  loop:
    - tinyproxy
    - zapret2
    - dnsmasq
  changed_when: false
