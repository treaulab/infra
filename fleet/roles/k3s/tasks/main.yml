---
# roles/k3s/tasks/main.yml — K3s server and agent convergence.

- name: Resolve K3s cluster token
  ansible.builtin.set_fact:
    k3s_node_token: >-
      {{
        k3s_token | default(
          lookup('file', playbook_dir + '/../../.kube/k3s-node-token', errors='ignore') | trim,
          true
        )
      }}

- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Deploy K3s server configuration
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: >-
      {{
        (k3s_server_config | default({
          'write-kubeconfig-mode': '0644',
          'disable': ['traefik', 'servicelb'],
          'tls-san': k3s_tls_san | default([ansible_host, inventory_hostname])
        })) | combine({'token': k3s_node_token} if k3s_node_token | default('') | length > 0 else {}) | to_nice_yaml
      }}
    mode: "0644"
  register: k3s_server_config_result
  when: k3s_role | default('server') == 'server'

- name: Deploy K3s agent configuration
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: >-
      {{
        {
          'server': k3s_server_url,
          'token': k3s_node_token
        } | to_nice_yaml
      }}
    mode: "0644"
  register: k3s_agent_config_result
  when: k3s_role | default('server') == 'agent'

- name: Download K3s installer script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0700"

- name: Execute K3s server installation
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh
    creates: /etc/systemd/system/k3s.service
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server"
  register: k3s_server_install
  when: k3s_role | default('server') == 'server'

- name: Execute K3s agent installation
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh
    creates: /etc/systemd/system/k3s-agent.service
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "agent"
    K3S_URL: "{{ k3s_server_url }}"
    K3S_TOKEN: "{{ k3s_node_token }}"
  register: k3s_agent_install
  when: k3s_role | default('server') == 'agent'

- name: Clean up K3s installer script
  ansible.builtin.file:
    path: /tmp/k3s-install.sh
    state: absent

- name: Ensure K3s server service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
  when: k3s_role | default('server') == 'server'

- name: Restart K3s server on config change
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when:
    - k3s_role | default('server') == 'server'
    - k3s_server_config_result.changed
    - not (k3s_server_install.changed | default(false))

- name: Ensure K3s agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
  when: k3s_role | default('server') == 'agent'

- name: Restart K3s agent on config change
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  when:
    - k3s_role | default('server') == 'agent'
    - k3s_agent_config_result.changed
    - not (k3s_agent_install.changed | default(false))

- name: Slurp K3s node token from server
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_token_b64
  when: k3s_role | default('server') == 'server'

- name: Ensure local .kube directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.kube"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: k3s_role | default('server') == 'server'

- name: Save K3s node token locally for agents
  ansible.builtin.copy:
    content: "{{ k3s_server_token_b64.content | b64decode | trim }}"
    dest: "{{ playbook_dir }}/../../.kube/k3s-node-token"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: k3s_role | default('server') == 'server'

- name: Fetch kubeconfig to local repository
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../.kube/k3s-{{ inventory_hostname }}.yaml"
    flat: true
  when: k3s_role | default('server') == 'server'

- name: Substitute server IP in local kubeconfig
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../../.kube/k3s-{{ inventory_hostname }}.yaml"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_host }}:6443"
  delegate_to: localhost
  become: false
  when: k3s_role | default('server') == 'server'

- name: Copy cluster kubeconfig as default .kube/k3s.yaml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../.kube/k3s-{{ inventory_hostname }}.yaml"
    dest: "{{ playbook_dir }}/../../.kube/k3s.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: k3s_role | default('server') == 'server'
