---
# roles/website/tasks/main.yml — Sync static website source to the host.
# Expects: website_src (relative repo path) and deploy_root.

- name: Ensure website source directory exists on host
  ansible.builtin.file:
    path: "{{ deploy_root }}/website/src"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Synchronize static website source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ website_src }}/"
    dest: "{{ deploy_root }}/website/src/"
    owner: "{{ ansible_user }}"
    mode: "0644"
