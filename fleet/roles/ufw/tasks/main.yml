---
# roles/ufw/tasks/main.yml — Firewall management.

- name: Ensure UFW package is installed
  ansible.builtin.apt:
    name: ufw
    state: present
  tags: [firewall]

- name: Configure UFW open ports
  ansible.builtin.command:
    cmd: "ufw allow {{ item }}/tcp"
  loop: "{{ base_ufw_ports | default(['22']) }}"
  changed_when: false
  tags: [firewall]

- name: Allow traffic on Tailscale interface
  ansible.builtin.command:
    cmd: "ufw allow in on tailscale0"
  changed_when: false
  tags: [firewall]

- name: Allow LAN subnet traffic
  ansible.builtin.command:
    cmd: "ufw allow from 192.168.10.0/24"
  when: ufw_allow_lan | default(false) | bool
  changed_when: false
  tags: [firewall]

- name: Enable UFW firewall (default deny incoming)
  ansible.builtin.command:
    cmd: "ufw --force enable"
  changed_when: false
  tags: [firewall]
