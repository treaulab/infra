---
# Install Tailscale and optionally join the tailnet. The auth key is NEVER
# stored in git: pass it at converge time via TAILSCALE_AUTHKEY, or leave it
# unset and run `tailscale up` manually on the host.
- name: Install Tailscale prerequisites
  ansible.builtin.apt:
    name: [curl, gnupg]
    state: present
    update_cache: true

- name: Add Tailscale signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_repo_os }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: ["https://pkgs.tailscale.com/stable/{{ tailscale_repo_os }}"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Read tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Record tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: >-
      {{ (tailscale_status.stdout | from_json).BackendState | default('')
         if tailscale_status.rc == 0 and tailscale_status.stdout else '' }}

- name: Join tailnet when an auth key is supplied
  ansible.builtin.command: >-
    tailscale up
    --hostname {{ tailscale_hostname }}
    --authkey {{ tailscale_authkey }}
    {{ '--accept-dns=false' if not tailscale_accept_dns else '' }}
  when:
    - tailscale_authkey | length > 0
    - tailscale_backend_state != 'Running'
  no_log: true
  changed_when: true

- name: Show manual join hint when no auth key was supplied
  ansible.builtin.debug:
    msg: >-
      Tailscale is installed but not joined. Run:
      tailscale up --hostname {{ tailscale_hostname }}
      {{ '--accept-dns=false' if not tailscale_accept_dns else '' }}
  when:
    - tailscale_authkey | length == 0
    - tailscale_backend_state != 'Running'
