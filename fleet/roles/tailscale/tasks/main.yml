---
# roles/tailscale/tasks/main.yml — Tailscale install and tailnet join.

- name: Download Tailscale apt repository key
  ansible.builtin.get_url:
    url: >-
      https://pkgs.tailscale.com/stable/{{
        'debian' if ansible_distribution | lower in ['debian', 'raspbian'] else 'ubuntu'
      }}/{{ ansible_distribution_release }}.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
  tags: [tailscale]

- name: Configure Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: >-
      https://pkgs.tailscale.com/stable/{{
        'debian' if ansible_distribution | lower in ['debian', 'raspbian'] else 'ubuntu'
      }}
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present
  tags: [tailscale]

- name: Install Tailscale package
  ansible.builtin.apt:
    name:
      - tailscale
      - tailscale-archive-keyring
    state: present
    update_cache: true
  tags: [tailscale]

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  tags: [tailscale]

- name: Check Tailscale status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  tags: [tailscale]
  changed_when: false
  failed_when: false

- name: Join tailnet if auth key provided and not running
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --reset
      --hostname {{ tailscale_hostname }}
      --authkey {{ tailscale_authkey }}
      --operator={{ ansible_user }}
      {{ ('--advertise-tags=' + tailscale_tags) if tailscale_tags | default('') | length > 0 else '' }}
      {{ tailscale_extra_args | default('') }}
  tags: [tailscale]
  when:
    - tailscale_authkey | length > 0
    - tailscale_status.stdout | length == 0 or ((tailscale_status.stdout | default('{}', true)) | from_json).BackendState | default('') != 'Running'
  no_log: true
  changed_when: true
