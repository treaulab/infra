---
- name: Clone the pinned upstream tag
  ansible.builtin.git:
    repo: "{{ dpi_bypass_repo }}"
    dest: "{{ dpi_bypass_source_dir }}"
    version: "v{{ dpi_bypass_version }}"
    depth: 1
    force: true

- name: Build byedpi from source
  ansible.builtin.command:
    cmd: >-
      make -C {{ dpi_bypass_source_dir }}
      -j {{ ansible_processor_vcpus | default(2) }}
    creates: "{{ dpi_bypass_source_dir }}/ciadpi"

- name: Install the source-built byedpi binary
  ansible.builtin.copy:
    src: "{{ dpi_bypass_source_dir }}/ciadpi"
    dest: "{{ dpi_bypass_bin }}"
    remote_src: true
    mode: "0755"
  notify:
    - Restart byedpi socks
    - Restart byedpi transparent
