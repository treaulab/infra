---
- name: Select the pinned release asset for this architecture
  ansible.builtin.set_fact:
    dpi_bypass_asset: "{{ dpi_bypass_release_assets[dpi_bypass_arch] | default({}) }}"

- name: Fail when no pinned release asset exists for this architecture
  ansible.builtin.assert:
    that:
      - dpi_bypass_asset | length > 0
    fail_msg: >-
      No pinned byedpi release for {{ ansible_architecture }} ({{ dpi_bypass_arch }}).
      Set dpi_bypass_install_method=source, or add the upstream asset and
      SHA256 for this architecture to dpi_bypass_release_assets.

- name: Set the controller-side artifact path
  ansible.builtin.set_fact:
    dpi_bypass_local_artifact: >-
      {{ dpi_bypass_local_cache_dir }}/{{ dpi_bypass_version }}-{{ inventory_hostname }}-{{ dpi_bypass_asset.file }}

- name: Ensure the release cache directory exists on the target
  ansible.builtin.file:
    path: "{{ dpi_bypass_cache_dir }}"
    state: directory
    mode: "0755"

- name: Ensure the controller download directory exists
  ansible.builtin.file:
    path: "{{ dpi_bypass_local_cache_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: dpi_bypass_release_artifact | length == 0

# Download on the controller so a target in a restricted network does not need
# direct GitHub access. The artifact is checksum-verified before it is copied.
- name: Download the pinned official release on the controller
  ansible.builtin.get_url:
    url: "{{ dpi_bypass_release_base_url }}/v{{ dpi_bypass_version }}/{{ dpi_bypass_asset.file }}"
    dest: "{{ dpi_bypass_local_artifact }}"
    checksum: "sha256:{{ dpi_bypass_asset.sha256 }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: dpi_bypass_release_artifact | length == 0

- name: Stat a pre-downloaded release artifact
  ansible.builtin.stat:
    path: "{{ dpi_bypass_release_artifact }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: dpi_bypass_release_artifact_stat
  when: dpi_bypass_release_artifact | length > 0

- name: Verify the pre-downloaded release artifact
  ansible.builtin.assert:
    that:
      - dpi_bypass_release_artifact_stat.stat.exists | default(false)
      - "(dpi_bypass_release_artifact_stat.stat.checksum | default('')) == dpi_bypass_asset.sha256"
    fail_msg: >-
      {{ dpi_bypass_release_artifact }} is missing or does not match the pinned
      SHA256 for {{ dpi_bypass_asset.file }}.
  when: dpi_bypass_release_artifact | length > 0

- name: Select the release artifact to copy
  ansible.builtin.set_fact:
    dpi_bypass_effective_artifact: >-
      {{ dpi_bypass_release_artifact
         if dpi_bypass_release_artifact | length > 0
         else dpi_bypass_local_artifact }}

- name: Copy the pinned release to the target
  ansible.builtin.copy:
    src: "{{ dpi_bypass_effective_artifact }}"
    dest: "{{ dpi_bypass_cache_dir }}/{{ dpi_bypass_asset.file }}"
    mode: "0644"

- name: Ensure the release extraction directory exists
  ansible.builtin.file:
    path: "{{ dpi_bypass_lib_dir }}/{{ dpi_bypass_version }}"
    state: directory
    mode: "0755"

- name: Extract the pinned release
  ansible.builtin.unarchive:
    src: "{{ dpi_bypass_cache_dir }}/{{ dpi_bypass_asset.file }}"
    dest: "{{ dpi_bypass_lib_dir }}/{{ dpi_bypass_version }}"
    remote_src: true
    creates: "{{ dpi_bypass_lib_dir }}/{{ dpi_bypass_version }}/{{ dpi_bypass_asset.binary }}"

- name: Ensure the extracted binary is executable
  ansible.builtin.file:
    path: "{{ dpi_bypass_lib_dir }}/{{ dpi_bypass_version }}/{{ dpi_bypass_asset.binary }}"
    mode: "0755"

- name: Install the byedpi binary
  ansible.builtin.copy:
    src: "{{ dpi_bypass_lib_dir }}/{{ dpi_bypass_version }}/{{ dpi_bypass_asset.binary }}"
    dest: "{{ dpi_bypass_bin }}"
    remote_src: true
    mode: "0755"
  notify:
    - Restart byedpi socks
    - Restart byedpi transparent
