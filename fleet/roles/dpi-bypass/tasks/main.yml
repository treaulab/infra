---
- name: Validate dpi_bypass_state
  ansible.builtin.assert:
    that:
      - dpi_bypass_state in ['present', 'absent']
    fail_msg: "dpi_bypass_state must be 'present' or 'absent'."

- name: Install and configure byedpi
  when: dpi_bypass_state == 'present'
  block:
    - name: Install byedpi
      ansible.builtin.include_tasks: install.yml

    - name: Configure byedpi services
      ansible.builtin.include_tasks: configure.yml

- name: Remove byedpi
  when: dpi_bypass_state == 'absent'
  block:
    - name: Remove byedpi
      ansible.builtin.include_tasks: absent.yml
