---
- name: Stop and disable byedpi services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - byedpi-socks
    - byedpi-transparent
    - byedpi-nat
  failed_when: false

- name: Stop and disable privoxy when the role manages it
  ansible.builtin.systemd:
    name: privoxy
    state: stopped
    enabled: false
  when: dpi_bypass_privoxy | bool
  failed_when: false

- name: Check whether the NAT helper script exists
  ansible.builtin.stat:
    path: "{{ dpi_bypass_nat_script }}"
  register: dpi_bypass_absent_nat_script

- name: Remove NAT rules before deleting the helper script
  ansible.builtin.command:
    cmd: "{{ dpi_bypass_nat_script }} remove"
  when: dpi_bypass_absent_nat_script.stat.exists | default(false)
  changed_when: false
  failed_when: false

- name: Remove byedpi systemd units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/byedpi-socks.service
    - /etc/systemd/system/byedpi-transparent.service
    - /etc/systemd/system/byedpi-nat.service

- name: Reload systemd after removing byedpi units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Check whether the privoxy config exists
  ansible.builtin.stat:
    path: /etc/privoxy/config
  register: dpi_bypass_absent_privoxy_config
  when: dpi_bypass_privoxy | bool

- name: Remove the privoxy loopback listener
  ansible.builtin.lineinfile:
    path: /etc/privoxy/config
    regexp: '^listen-address\s+127\.0\.0\.1:'
    state: absent
  when:
    - dpi_bypass_privoxy | bool
    - dpi_bypass_absent_privoxy_config.stat.exists | default(false)

- name: Remove the privoxy SOCKS5 forwarder
  ansible.builtin.lineinfile:
    path: /etc/privoxy/config
    regexp: '^forward-socks5\s+/\s+127\.0\.0\.1:'
    state: absent
  when:
    - dpi_bypass_privoxy | bool
    - dpi_bypass_absent_privoxy_config.stat.exists | default(false)

- name: Remove the privoxy package when requested
  ansible.builtin.apt:
    name: privoxy
    state: absent
    purge: true
  when: dpi_bypass_remove_privoxy_package | bool

- name: Remove the installed binary and role data
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ dpi_bypass_bin }}"
    - "{{ dpi_bypass_lib_dir }}"
    - "{{ dpi_bypass_cache_dir }}"
    - "{{ dpi_bypass_source_dir }}"
    - "{{ dpi_bypass_nat_script }}"

- name: Remove the byedpi system user
  ansible.builtin.user:
    name: "{{ dpi_bypass_user }}"
    state: absent

- name: Remove the byedpi system group
  ansible.builtin.group:
    name: "{{ dpi_bypass_group }}"
    state: absent
