---
- name: Base packages (ufw, fail2ban, unattended-upgrades)
  ansible.builtin.apt:
    name: [ufw, fail2ban, unattended-upgrades, curl, ca-certificates, rsync]
    state: present
    update_cache: true

# Public ports are deliberately explicit: the VPS needs 80/443, the homelab
# only needs 22. Direct Tailscale traffic is allowed on tailscale0 below.
- name: Allow required TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ base_ufw_ports }}"

- name: Allow inbound traffic on the tailnet interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in

- name: Enable UFW (deny inbound by default)
  community.general.ufw:
    state: enabled
    policy: deny

- name: Enable unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51-unattended-upgrades-treaulab
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
