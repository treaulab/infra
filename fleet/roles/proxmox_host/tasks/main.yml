---
# fleet/roles/proxmox_host/tasks/main.yml — Proxmox VE hypervisor host convergence.

- name: Disable PVE and Ceph enterprise repositories (.list and .sources)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pve-enterprise.list
    - /etc/apt/sources.list.d/pve-enterprise.sources
    - /etc/apt/sources.list.d/ceph.list
    - /etc/apt/sources.list.d/ceph.sources
  when: proxmox_host_disable_enterprise_repo | bool
  tags: [proxmox]

- name: Enable PVE no-subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
    state: present
    filename: pve-no-subscription
  when: proxmox_host_no_subscription_repo | bool
  tags: [proxmox]

- name: Enable snippets and import content types on local storage
  ansible.builtin.command:
    cmd: pvesm set local --content iso,vztmpl,backup,snippets,import
  changed_when: false
  when: proxmox_host_enable_snippets | bool
  tags: [proxmox]

- name: Remove legacy cpu-governor service if present
  ansible.builtin.systemd:
    name: cpu-governor
    state: stopped
    enabled: false
  failed_when: false
  tags: [proxmox]

- name: Remove legacy cpu-governor unit file if present
  ansible.builtin.file:
    path: /etc/systemd/system/cpu-governor.service
    state: absent
  failed_when: false
  tags: [proxmox]

- name: Restore original subscription check in proxmoxlib.js if previously modified
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: '(!res \|\| )false(\))'
    replace: "\\1res.data.status.toLowerCase() !== 'active'\\2"
  failed_when: false
  tags: [proxmox]

- name: Create or update PVE Terraform role for OpenTofu
  ansible.builtin.shell:
    cmd: >-
      pveum role add Terraform -privs
      "VM.Allocate VM.Clone VM.Config.CDROM VM.Config.CPU VM.Config.Cloudinit
      VM.Config.Disk VM.Config.HWType VM.Config.Memory VM.Config.Network
      VM.Config.Options VM.Console VM.Audit VM.PowerMgmt Datastore.Allocate
      Datastore.AllocateSpace Datastore.AllocateTemplate Datastore.Audit SDN.Use
      Sys.Audit Sys.Modify Sys.Console Pool.Allocate" 2>/dev/null ||
      pveum role modify Terraform -privs
      "VM.Allocate VM.Clone VM.Config.CDROM VM.Config.CPU VM.Config.Cloudinit
      VM.Config.Disk VM.Config.HWType VM.Config.Memory VM.Config.Network
      VM.Config.Options VM.Console VM.Audit VM.PowerMgmt Datastore.Allocate
      Datastore.AllocateSpace Datastore.AllocateTemplate Datastore.Audit SDN.Use
      Sys.Audit Sys.Modify Sys.Console Pool.Allocate"
  changed_when: false
  tags: [proxmox]

- name: Create PVE terraform user for OpenTofu
  ansible.builtin.command:
    cmd: pveum user add terraform@pve --comment "OpenTofu Automation"
  register: pve_user
  failed_when: pve_user.rc != 0 and 'already exists' not in pve_user.stderr
  changed_when: pve_user.rc == 0
  tags: [proxmox]

- name: Grant Terraform role on / to terraform@pve
  ansible.builtin.command:
    cmd: pveum aclmod / -user terraform@pve -role Terraform
  changed_when: false
  tags: [proxmox]

- name: Check existing tokens for terraform@pve
  ansible.builtin.command:
    cmd: pveum user token list terraform@pve --output-format json
  register: pve_token_list
  changed_when: false
  tags: [proxmox]

- name: Mint OpenTofu API token (terraform@pve!tofu-token) if not present
  ansible.builtin.command:
    cmd: pveum user token add terraform@pve tofu-token --privsep 0 --output-format json
  register: pve_token_minted
  when: "'\"tokenid\":\"tofu-token\"' not in pve_token_list.stdout"
  changed_when: true
  tags: [proxmox]

- name: Display newly minted Proxmox API token for .envrc
  ansible.builtin.debug:
    msg:
      - "Copy into your .envrc:"
      - "export PROXMOX_VE_ENDPOINT=\"https://{{ ansible_host }}:8006\""
      - "export PROXMOX_VE_API_TOKEN=\"terraform@pve!tofu-token={{ (pve_token_minted.stdout | from_json).value }}\""
      - "export PROXMOX_VE_INSECURE=\"true\""
  when:
    - pve_token_minted is defined
    - pve_token_minted.stdout is defined
    - pve_token_minted.stdout | length > 0
  tags: [proxmox]
