---
# roles/dpi_gateway/tasks/main.yml — DPI Bypass Gateway Convergence (Ubuntu Minimal).

- name: Deploy kernel sysctl and proxy tuning parameters
  ansible.builtin.template:
    src: 99-gateway.conf.j2
    dest: /etc/sysctl.d/99-gateway.conf
    mode: "0644"
  notify: Apply sysctl

- name: Configure glibc getaddrinfo to prefer IPv4 over IPv6 (prevent dead AAAA timeouts)
  ansible.builtin.copy:
    dest: /etc/gai.conf
    mode: "0644"
    content: |
      # Managed by Ansible (roles/dpi_gateway). Prefer IPv4 to avoid IPv6 connection timeouts.
      precedence ::ffff:0:0/96 100

- name: Ensure legacy dnsmasq service is stopped and disabled
  ansible.builtin.systemd:
    name: dnsmasq
    state: stopped
    enabled: false
  failed_when: false

- name: Remove systemd-resolved DNSStubListener override if present
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d/disable-stub.conf
    state: absent
  notify: Restart systemd-resolved

- name: Restore default systemd-resolved resolv.conf symlink
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  notify: Restart systemd-resolved

- name: Install required gateway packages
  ansible.builtin.apt:
    name:
      - nftables
      - tinyproxy
      - nginx-light
      - git
      - build-essential
      - libnetfilter-queue-dev
      - libluajit-5.1-dev
      - libcap-dev
      - libmnl-dev
      - libsystemd-dev
      - zlib1g-dev
      - pkg-config
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure zapret system group exists
  ansible.builtin.group:
    name: "{{ gateway_zapret_user }}"
    system: true
    state: present

- name: Ensure zapret system user exists
  ansible.builtin.user:
    name: "{{ gateway_zapret_user }}"
    group: "{{ gateway_zapret_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Deploy declarative nftables configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
  notify: Restart nftables

- name: Ensure tinyproxy systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/tinyproxy.service.d
    state: directory
    mode: "0755"

- name: Deploy tinyproxy resource limits override
  ansible.builtin.copy:
    dest: /etc/systemd/system/tinyproxy.service.d/limits.conf
    mode: "0644"
    content: |
      [Service]
      LimitNOFILE=65536
  notify: Restart tinyproxy

- name: Deploy tinyproxy configuration
  ansible.builtin.template:
    src: tinyproxy.conf.j2
    dest: /etc/tinyproxy/tinyproxy.conf
    mode: "0644"
  notify: Restart tinyproxy

- name: Clone Zapret2 from GitLab mirror
  ansible.builtin.git:
    repo: "{{ gateway_zapret_git_url }}"
    version: "{{ gateway_zapret_version }}"
    dest: /opt/zapret2
    depth: 1
    force: true
  register: zapret2_git

- name: Check if Zapret2 binary already exists
  ansible.builtin.stat:
    path: /opt/zapret2/binaries/my/nfqws2
  register: zapret2_bin_stat

- name: Compile Zapret2 binaries with systemd support
  ansible.builtin.command:
    cmd: make systemd
    chdir: /opt/zapret2
  when: zapret2_git.changed or not zapret2_bin_stat.stat.exists
  notify: Restart zapret2

- name: Deploy Zapret2 runtime configuration
  ansible.builtin.template:
    src: zapret2.conf.j2
    dest: /opt/zapret2/config
    mode: "0644"
  notify: Restart zapret2

- name: Ensure Zapret2 ipset directory exists
  ansible.builtin.file:
    path: /opt/zapret2/ipset
    state: directory
    mode: "0755"

- name: Deploy Zapret2 IP exclusions
  ansible.builtin.template:
    src: zapret-ip-exclude.txt.j2
    dest: /opt/zapret2/ipset/zapret-ip-exclude.txt
    mode: "0644"
  notify: Restart zapret2

- name: Deploy Zapret2 host exclusions
  ansible.builtin.template:
    src: zapret-hosts-user-exclude.txt.j2
    dest: /opt/zapret2/ipset/zapret-hosts-user-exclude.txt
    mode: "0644"
  notify: Restart zapret2

- name: Deploy Zapret2 systemd unit
  ansible.builtin.template:
    src: zapret2.service.j2
    dest: /etc/systemd/system/zapret2.service
    mode: "0644"
  notify: Restart zapret2

- name: Deploy nginx PAC site configuration
  ansible.builtin.template:
    src: nginx-pac.conf.j2
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Restart nginx

- name: Ensure default nginx site is enabled
  ansible.builtin.file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
    force: true
  notify: Restart nginx

- name: Ensure web root directory exists
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    mode: "0755"

- name: Deploy PAC configuration script
  ansible.builtin.template:
    src: sits.pac.j2
    dest: /var/www/html/sits.pac
    mode: "0644"

- name: Create PAC script compatibility symlinks
  ansible.builtin.file:
    src: sits.pac
    dest: "/var/www/html/{{ item }}"
    state: link
    force: true
  loop:
    - proxy.pac
    - wpad.dat

- name: Ensure systemd daemon is reloaded
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start gateway systemd services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nftables
    - tinyproxy
    - zapret2
    - nginx

- name: Flush handlers to ensure gateway services are active before proceeding
  ansible.builtin.meta: flush_handlers
