---
# roles/dpi_gateway/handlers/main.yml

- name: Apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Restart nftables
  ansible.builtin.systemd:
    name: nftables
    state: restarted
  notify: Restart zapret2

- name: Restart dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted

- name: Restart tinyproxy
  ansible.builtin.systemd:
    name: tinyproxy
    state: restarted

- name: Restart zapret2
  ansible.builtin.systemd:
    name: zapret2
    state: restarted
