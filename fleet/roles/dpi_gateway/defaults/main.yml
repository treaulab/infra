---
# roles/dpi_gateway/defaults/main.yml — Default parameters for Transparent DPI Bypass Gateway.

gateway_ip: "192.168.10.2"
gateway_netmask: "255.255.255.0"
gateway_interface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
gateway_upstream_router: "192.168.10.1"
gateway_dns_upstream: "192.168.10.5"

gateway_zapret_git_url: "https://gitlab.com/samuellance73/zapret2.git"
gateway_zapret_version: "v1.0.7"
gateway_zapret_user: "tpws"
gateway_zapret_qnum: 300
gateway_zapret_mark: "0x40000000"
gateway_zapret_ports_tcp: "443"
gateway_zapret_ports_udp: ""

gateway_zapret_desync_opt: "--filter-tcp=443 --hostlist-exclude=/opt/zapret2/ipset/zapret-hosts-user-exclude.txt --lua-desync=oob:urp=midsld:char=a"

gateway_zapret_ip_exclusions:
  - "192.168.10.0/24"
  - "100.64.0.0/10"
  - "23.0.0.0/8"

gateway_zapret_host_exclusions:
  - "quay.io"
  - "cdn01.quay.io"

gateway_tinyproxy_port: 8888
gateway_tinyproxy_max_clients: 1024
gateway_tinyproxy_allowed:
  - "127.0.0.1"
  - "192.168.10.0/24"
  - "100.64.0.0/10"
