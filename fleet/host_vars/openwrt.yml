---
# fleet/host_vars/openwrt.yml — OpenWrt Gateway host overrides.

ansible_python_interpreter: /usr/bin/python3

# Disable Debian/Ubuntu specific baseline roles
enable_ufw: false
enable_fail2ban: false
enable_ssh_hardening: false
enable_docker: false
enable_byedpi: false
enable_k3s: false
enable_proxmox_host: false
enable_tailscale: false

# Enable OpenWrt gateway role
enable_openwrt_gateway: true

openwrt_ip: "192.168.10.2"
openwrt_netmask: "255.255.255.0"
openwrt_gateway: "192.168.10.1"
openwrt_dns: "192.168.10.5"
openwrt_tailscale_gateway: "192.168.10.88"
