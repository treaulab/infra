[defaults]
inventory = inventory/prod.yml
host_key_checking = True
retry_files_enabled = False
forks = 10
pipelining = True
deprecation_warnings = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
