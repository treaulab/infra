---
# fleet/group_vars/edge.yml — Azure VPS (Caddy + static site).

enable_ufw: true
enable_fail2ban: true
enable_ssh_hardening: true
enable_docker: true
enable_tailscale: true

base_ufw_ports: ["22", "80", "443"]
tailscale_tags: "tag:server"
tailscale_extra_args: "--ssh"

caddy_env_content: |
  # Managed by Ansible. Do not edit on the host.
  DOMAIN={{ domain }}
  ACME_EMAIL={{ acme_email }}
  CADDY_VERSION={{ caddy_version }}
  SITE_IP={{ site_ip }}
