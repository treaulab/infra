---
# fleet/group_vars/untrusted.yml — Shared workstations.

enable_docker: true
enable_byedpi: true
enable_tailscale: true

enable_docker_prune_cron: false
enable_apt_autoremove_cron: false

ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
tailscale_tags: "tag:untrusted"
tailscale_extra_args: "--ssh"
