all:
  children:
    edge:
      hosts:
        vps:
          ansible_host: vps
          ansible_user: azureuser
          ansible_ssh_private_key_file: ~/.ssh/King_key.pem
          compose_stacks:
            - name: caddy
              src: stacks/edge/caddy
              env_content: "{{ caddy_env_content }}"
    hypervisors:
      hosts:
        entia:
          ansible_host: 192.168.10.10
          ansible_user: root
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
    cluster:
      hosts:
        mercury:
          ansible_host: 192.168.10.11 # Proxmox VM 500 LAN IP
          ansible_user: treau
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
          k3s_role: server
          k3s_tls_san:
            - "192.168.10.11"
            - "mercury"
            - "100.126.215.63"
            - "mercury-1"
        venus:
          ansible_host: 192.168.10.13 # Proxmox VM 501 LAN IP
          ansible_user: treau
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
