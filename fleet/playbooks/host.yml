---
# fleet/playbooks/host.yml — OS baseline convergence across all fleet machines.
- name: Host OS baseline
  hosts: all
  become: true
  vars:
    tailscale_authkey: "{{ lookup('env', 'TAILSCALE_AUTHKEY') | default('', true) }}"
  roles:
    - role: proxmox_host
      when: enable_proxmox_host | default(false) | bool
      tags: [proxmox]
    - role: byedpi
      when: enable_byedpi | default(false) | bool
      tags: [byedpi]
    - role: common
    - role: ufw
      when: enable_ufw | default(false) | bool
      tags: [firewall]
    - role: fail2ban
      when: enable_fail2ban | default(false) | bool
      tags: [fail2ban]
    - role: docker
      when: enable_docker | default(false) | bool
      tags: [docker]
    - role: tailscale
      when: enable_tailscale | default(false) | bool
      tags: [tailscale]
    - role: k3s
      when: enable_k3s | default(false) | bool
      tags: [k3s]
    - role: dpi_gateway
      when: enable_dpi_gateway | default(false) | bool
      tags: [gateway]
