---
# Converge host OS baseline: packages, UFW hardening, Docker, K3s, and Tailscale.
- name: Host OS baseline
  hosts: all
  become: true
  vars:
    tailscale_authkey: "{{ lookup('env', 'TAILSCALE_AUTHKEY') | default('', true) }}"
    tailscale_hostname: "{{ inventory_hostname }}"
  tasks:
    - name: Wait for cloud-init to finish if running
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Install base security & utility packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - curl
          - ca-certificates
          - rsync
          - gnupg
          - htop
          - jq
          - tmux
          - netcat-openbsd
          - qemu-guest-agent
          - git
        state: present
        update_cache: true

    - name: Configure UFW open ports
      ansible.builtin.command:
        cmd: "ufw allow {{ item }}/tcp"
      loop: "{{ base_ufw_ports | default(['22']) }}"
      changed_when: false

    - name: Allow traffic on Tailscale interface
      ansible.builtin.command:
        cmd: "ufw allow in on tailscale0"
      changed_when: false

    - name: Allow LAN subnet traffic for internal cluster nodes
      ansible.builtin.command:
        cmd: "ufw allow from 192.168.10.0/24"
      when: "'internal' in group_names"
      changed_when: false

    - name: Enable UFW firewall (default deny incoming)
      ansible.builtin.command:
        cmd: "ufw --force enable"
      changed_when: false

    - name: Configure unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51-unattended-upgrades-treaulab
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    # --- Docker Engine ---
    - name: Install Docker via official script # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://get.docker.com | sh
        executable: /bin/bash
      args:
        creates: /usr/bin/docker

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # --- K3s Engine (Runs before Tailscale) ---
    - name: Ensure /etc/rancher/k3s directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"
      when: enable_k3s | default(false) | bool

    - name: Deploy K3s server configuration
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: >-
          {{
            k3s_server_config | default({
              'write-kubeconfig-mode': '0644',
              'disable': ['traefik', 'servicelb'],
              'tls-san': k3s_tls_san | default([ansible_host, inventory_hostname])
            }) | to_nice_yaml
          }}
        mode: "0644"
      register: k3s_server_config_result
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'server'

    - name: Read K3s node token for agent
      ansible.builtin.set_fact:
        k3s_node_token: >-
          {{
            k3s_token | default(
              lookup('file', playbook_dir + '/../../.kube/k3s-node-token', errors='ignore') | trim,
              true
            )
          }}
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'agent'

    - name: Deploy K3s agent configuration
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: >-
          {{
            {
              'server': k3s_server_url,
              'token': k3s_node_token
            } | to_nice_yaml
          }}
        mode: "0644"
      register: k3s_agent_config_result
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'agent'

    - name: Ensure local cache directory exists # noqa: run-once[task]
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../.cache"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true
      when: enable_k3s | default(false) | bool

    - name: Download K3s binary on controller (bypasses ISP DPI blocks) # noqa: run-once[task]
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | default('v1.31.2+k3s1') }}/k3s"
        dest: "{{ playbook_dir }}/../../.cache/k3s-amd64"
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true
      when: enable_k3s | default(false) | bool

    - name: Copy K3s binary to target node
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../.cache/k3s-amd64"
        dest: /usr/local/bin/k3s
        mode: "0755"
      when: enable_k3s | default(false) | bool

    - name: Download K3s installer script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0700"
      when: enable_k3s | default(false) | bool

    - name: Execute K3s server installation
      ansible.builtin.command:
        cmd: /tmp/k3s-install.sh
        creates: /etc/systemd/system/k3s.service
      environment:
        INSTALL_K3S_SKIP_DOWNLOAD: "true"
        INSTALL_K3S_EXEC: "server"
      register: k3s_server_install
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'server'

    - name: Execute K3s agent installation
      ansible.builtin.command:
        cmd: /tmp/k3s-install.sh
        creates: /etc/systemd/system/k3s-agent.service
      environment:
        INSTALL_K3S_SKIP_DOWNLOAD: "true"
        INSTALL_K3S_EXEC: "agent"
        K3S_URL: "{{ k3s_server_url }}"
        K3S_TOKEN: "{{ k3s_node_token }}"
      register: k3s_agent_install
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'agent'

    - name: Clean up K3s installer script
      ansible.builtin.file:
        path: /tmp/k3s-install.sh
        state: absent
      when: enable_k3s | default(false) | bool

    - name: Ensure K3s server service is enabled and running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'server'

    - name: Ensure K3s agent service is enabled and running
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'agent'

    - name: Slurp K3s node token from server
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_server_token_b64
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'server'

    - name: Ensure local .kube directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../.kube"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'server'

    - name: Save K3s node token locally for agents
      ansible.builtin.copy:
        content: "{{ k3s_server_token_b64.content | b64decode | trim }}"
        dest: "{{ playbook_dir }}/../../.kube/k3s-node-token"
        mode: "0600"
      delegate_to: localhost
      become: false
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'server'

    - name: Fetch kubeconfig to local repository
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../../.kube/k3s-{{ inventory_hostname }}.yaml"
        flat: true
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'server'

    - name: Copy cluster kubeconfig as default .kube/k3s.yaml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../.kube/k3s-{{ inventory_hostname }}.yaml"
        dest: "{{ playbook_dir }}/../../.kube/k3s.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
      when:
        - enable_k3s | default(false) | bool
        - k3s_role | default('server') == 'server'

    # --- Tailscale (Runs AFTER K3s so zapret2 unblocks DPI first) ---
    - name: Download Tailscale apt repository key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Configure Tailscale apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        uris: https://pkgs.tailscale.com/stable/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: main
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present

    - name: Install Tailscale package
      ansible.builtin.apt:
        name:
          - tailscale
          - tailscale-archive-keyring
        state: present
        update_cache: true

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check Tailscale status
      ansible.builtin.command:
        cmd: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Join tailnet if auth key provided and not running
      ansible.builtin.command:
        cmd: "tailscale up --hostname {{ tailscale_hostname }} --authkey {{ tailscale_authkey }} --operator={{ ansible_user }}"
      when:
        - tailscale_authkey | length > 0
        - tailscale_status.stdout | length == 0 or ((tailscale_status.stdout | default('{}', true)) | from_json).BackendState | default('') != 'Running'
      no_log: true
      changed_when: true
