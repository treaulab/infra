---
# Converge host OS baseline: packages, UFW hardening, Tailscale, Docker, and optional K3s.
- name: Host OS baseline
  hosts: all
  become: true
  vars:
    tailscale_authkey: "{{ lookup('env', 'TAILSCALE_AUTHKEY') | default('', true) }}"
    tailscale_hostname: "{{ inventory_hostname }}"
  tasks:
    - name: Wait for cloud-init to finish if running
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Install base security & utility packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - curl
          - ca-certificates
          - rsync
          - gnupg
          - htop
          - jq
          - tmux
          - netcat-openbsd
          - qemu-guest-agent
          - git
        state: present
        update_cache: true

    - name: Configure UFW open ports
      ansible.builtin.command:
        cmd: "ufw allow {{ item }}/tcp"
      loop: "{{ base_ufw_ports | default(['22']) }}"
      changed_when: false

    - name: Allow traffic on Tailscale interface
      ansible.builtin.command:
        cmd: "ufw allow in on tailscale0"
      changed_when: false

    - name: Enable UFW firewall (default deny incoming)
      ansible.builtin.command:
        cmd: "ufw --force enable"
      changed_when: false

    - name: Configure unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51-unattended-upgrades-treaulab
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    # --- Tailscale ---
    - name: Download Tailscale apt repository key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Configure Tailscale apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
          https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main
        state: present
        filename: tailscale

    - name: Install Tailscale package
      ansible.builtin.apt:
        name:
          - tailscale
          - tailscale-archive-keyring
        state: present
        update_cache: true

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check Tailscale status
      ansible.builtin.command:
        cmd: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Join tailnet if auth key provided and not running
      ansible.builtin.command:
        cmd: "tailscale up --hostname {{ tailscale_hostname }} --authkey {{ tailscale_authkey }} --operator={{ ansible_user }}"
      when:
        - tailscale_authkey | length > 0
        - tailscale_status.stdout | length == 0 or ((tailscale_status.stdout | default('{}', true)) | from_json).BackendState | default('') != 'Running'
      no_log: true
      changed_when: true

    # --- Docker ---
    - name: Install Docker via official script # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://get.docker.com | sh
        executable: /bin/bash
      args:
        creates: /usr/bin/docker

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # --- K3s (Optional Node Role) ---
    - name: Ensure /etc/rancher/k3s directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"
      when: enable_k3s | default(false) | bool

    - name: Deploy k3s configuration
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: >-
          {{
            k3s_server_config | default({
              'write-kubeconfig-mode': '0644',
              'disable': ['traefik', 'servicelb'],
              'tls-san': k3s_tls_san | default([ansible_host, inventory_hostname])
            }) | to_nice_yaml
          }}
        mode: "0644"
      register: k3s_config
      when: enable_k3s | default(false) | bool

    - name: Download K3s installer script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0700"
      when: enable_k3s | default(false) | bool

    - name: Execute K3s installation
      ansible.builtin.command:
        cmd: /tmp/k3s-install.sh
        creates: /usr/local/bin/k3s
      environment: "{{ {'INSTALL_K3S_VERSION': k3s_version} if k3s_version | default('') else {} }}"
      register: k3s_install
      when: enable_k3s | default(false) | bool

    - name: Clean up K3s installer script
      ansible.builtin.file:
        path: /tmp/k3s-install.sh
        state: absent
      when: enable_k3s | default(false) | bool

    - name: Restart k3s service if configuration changed
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when:
        - enable_k3s | default(false) | bool
        - k3s_config.changed
        - not k3s_install.changed

    - name: Ensure k3s service is enabled and running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started
      when: enable_k3s | default(false) | bool

    - name: Fetch kubeconfig to local repository
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../../.kube/k3s-{{ inventory_hostname }}.yaml"
        flat: true
      when: enable_k3s | default(false) | bool
