---
# Converge host OS baseline across all fleet machines:
# packages, Docker Engine, unattended upgrades, UFW (servers only), and Tailscale.
- name: Host OS baseline
  hosts: all
  become: true
  vars:
    tailscale_authkey: "{{ lookup('env', 'TAILSCALE_AUTHKEY') | default('', true) }}"
    tailscale_hostname: "{{ inventory_hostname }}"
  tasks:
    - name: Wait for cloud-init to finish if running
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Configure passwordless sudo for admin user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/ansible-{{ ansible_user }}"
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
      tags: [sudoers]

    # --- DPI Circumvention (Workstations) ---
    - name: Converge ByeDPI transparent & SOCKS5 proxy
      ansible.builtin.include_tasks:
        file: tasks/byedpi.yml
        apply:
          tags: [byedpi]
      when: enable_byedpi | default(false) | bool
      tags: [byedpi]

    - name: Install base security & utility packages
      ansible.builtin.apt:
        name:
          - ufw
          - unattended-upgrades
          - curl
          - ca-certificates
          - rsync
          - gnupg
          - htop
          - jq
          - tmux
          - netcat-openbsd
          - git
          - python3-debian
          - python3-apt
          - dnsutils
          - lsof
        state: present
        update_cache: true
      tags: [packages]

    # --- Firewall Management ---
    - name: Configure and enable UFW on servers
      when: enable_ufw | default(true) | bool
      tags: [firewall]
      block:
        - name: Configure UFW open ports
          ansible.builtin.command:
            cmd: "ufw allow {{ item }}/tcp"
          loop: "{{ base_ufw_ports | default(['22']) }}"
          changed_when: false

        - name: Allow traffic on Tailscale interface
          ansible.builtin.command:
            cmd: "ufw allow in on tailscale0"
          changed_when: false

        - name: Allow LAN subnet traffic for internal servers
          ansible.builtin.command:
            cmd: "ufw allow from 192.168.10.0/24"
          when: "'internal' in group_names"
          changed_when: false

        - name: Enable UFW firewall (default deny incoming)
          ansible.builtin.command:
            cmd: "ufw --force enable"
          changed_when: false

    - name: Ensure UFW is disabled on workstations
      ansible.builtin.command:
        cmd: "ufw disable"
      tags: [firewall]
      when: not (enable_ufw | default(true) | bool)
      changed_when: false

    - name: Configure unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51-unattended-upgrades-treaulab
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"
      tags: [packages]

    # --- Docker Engine ---
    - name: Install Docker via official script # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://get.docker.com | sh
        executable: /bin/bash
      args:
        creates: /usr/bin/docker
      tags: [docker]

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      tags: [docker]

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      tags: [docker]

    # --- Tailscale (Node baseline) ---
    - name: Download Tailscale apt repository key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
      tags: [tailscale]

    - name: Configure Tailscale apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        uris: https://pkgs.tailscale.com/stable/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: main
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present
      tags: [tailscale]

    - name: Install Tailscale package
      ansible.builtin.apt:
        name:
          - tailscale
          - tailscale-archive-keyring
        state: present
        update_cache: true
      tags: [tailscale]

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started
      tags: [tailscale]

    - name: Check Tailscale status
      ansible.builtin.command:
        cmd: tailscale status --json
      register: tailscale_status
      tags: [tailscale]
      changed_when: false
      failed_when: false

    - name: Join tailnet if auth key provided and not running
      ansible.builtin.command:
        cmd: >-
          tailscale up
          --hostname {{ tailscale_hostname }}
          --authkey {{ tailscale_authkey }}
          --operator={{ ansible_user }}
          {{ ('--advertise-tags=' + tailscale_tags) if tailscale_tags | default('') | length > 0 else '' }}
          {{ tailscale_extra_args | default('') }}
      tags: [tailscale]
      when:
        - tailscale_authkey | length > 0
        - tailscale_status.stdout | length == 0 or ((tailscale_status.stdout | default('{}', true)) | from_json).BackendState | default('') != 'Running'
      no_log: true
      changed_when: true

  handlers:
    - name: Restart byedpi-transparent
      ansible.builtin.systemd:
        name: byedpi-transparent
        state: restarted
        daemon_reload: true

    - name: Restart byedpi-socks
      ansible.builtin.systemd:
        name: byedpi-socks
        state: restarted
        daemon_reload: true

    - name: Restart byedpi-nat
      ansible.builtin.systemd:
        name: byedpi-nat
        state: restarted
        daemon_reload: true
