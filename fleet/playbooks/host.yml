---
# Converge host OS baseline: packages, UFW hardening, Docker, K3s, and Tailscale.
- name: Host OS baseline
  hosts: all
  become: true
  vars:
    tailscale_authkey: "{{ lookup('env', 'TAILSCALE_AUTHKEY') | default('', true) }}"
    tailscale_hostname: "{{ inventory_hostname }}"
  tasks:
    - name: Wait for cloud-init to finish if running
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      failed_when: false

    # --- Network Gateway & DNS Persistence (Internal Nodes) ---
    - name: Check if Netplan configuration exists
      ansible.builtin.stat:
        path: /etc/netplan/50-cloud-init.yaml
      register: netplan_cloud_init
      when:
        - "'internal' in group_names"
        - internal_gateway is defined

    - name: Persist default gateway to transparent proxy in Netplan
      ansible.builtin.replace:
        path: /etc/netplan/50-cloud-init.yaml
        regexp: 'via:\s+"?192\.168\.10\.[0-9]+"?'
        replace: 'via: "{{ internal_gateway }}"'
      when:
        - "'internal' in group_names"
        - internal_gateway is defined
        - netplan_cloud_init.stat.exists
      register: netplan_gw_update

    - name: Persist primary DNS to transparent proxy in Netplan
      ansible.builtin.replace:
        path: /etc/netplan/50-cloud-init.yaml
        regexp: '-\s+192\.168\.10\.[0-9]+'
        replace: '- {{ internal_gateway }}'
      when:
        - "'internal' in group_names"
        - internal_gateway is defined
        - netplan_cloud_init.stat.exists
      register: netplan_dns_update

    - name: Apply persistent Netplan configuration
      ansible.builtin.command:
        cmd: netplan apply
      when:
        - "'internal' in group_names"
        - internal_gateway is defined
        - (netplan_gw_update.changed | default(false)) or (netplan_dns_update.changed | default(false))
      changed_when: true

    - name: Install base security & utility packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - curl
          - ca-certificates
          - rsync
          - gnupg
          - htop
          - jq
          - tmux
          - netcat-openbsd
          - qemu-guest-agent
          - git
          - python3-debian
        state: present
        update_cache: true

    - name: Configure UFW open ports
      ansible.builtin.command:
        cmd: "ufw allow {{ item }}/tcp"
      loop: "{{ base_ufw_ports | default(['22']) }}"
      changed_when: false

    - name: Allow traffic on Tailscale interface
      ansible.builtin.command:
        cmd: "ufw allow in on tailscale0"
      changed_when: false

    - name: Allow LAN subnet traffic for internal cluster nodes
      ansible.builtin.command:
        cmd: "ufw allow from 192.168.10.0/24"
      when: "'internal' in group_names"
      changed_when: false

    - name: Enable UFW firewall (default deny incoming)
      ansible.builtin.command:
        cmd: "ufw --force enable"
      changed_when: false

    - name: Configure unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51-unattended-upgrades-treaulab
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    # --- Docker Engine ---
    - name: Install Docker via official script # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://get.docker.com | sh
        executable: /bin/bash
      args:
        creates: /usr/bin/docker

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # --- K3s Engine (Internal Cluster Nodes) ---
    - name: Converge K3s cluster components
      ansible.builtin.include_tasks: tasks/k3s.yml
      when: enable_k3s | default(false) | bool

    # --- Tailscale (Node baseline) ---
    - name: Download Tailscale apt repository key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Configure Tailscale apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        uris: https://pkgs.tailscale.com/stable/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: main
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present

    - name: Install Tailscale package
      ansible.builtin.apt:
        name:
          - tailscale
          - tailscale-archive-keyring
        state: present
        update_cache: true

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check Tailscale status
      ansible.builtin.command:
        cmd: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Join tailnet if auth key provided and not running
      ansible.builtin.command:
        cmd: "tailscale up --hostname {{ tailscale_hostname }} --authkey {{ tailscale_authkey }} --operator={{ ansible_user }}"
      when:
        - tailscale_authkey | length > 0
        - tailscale_status.stdout | length == 0 or ((tailscale_status.stdout | default('{}', true)) | from_json).BackendState | default('') != 'Running'
      no_log: true
      changed_when: true
