---
- name: Converge minimal K3s server
  hosts: internal
  become: true
  vars:
    k3s_version: ""
    k3s_server_config:
      write-kubeconfig-mode: "0644"
      disable:
        - traefik
        - servicelb
      tls-san: "{{ k3s_tls_san | default([ansible_host, inventory_hostname]) }}"
  tasks:
    - name: Ensure /etc/rancher/k3s directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Deploy k3s configuration
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: "{{ k3s_server_config | to_nice_yaml }}"
        mode: "0644"
      register: k3s_config

    - name: Download K3s installer script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0700"

    - name: Execute K3s installation
      ansible.builtin.command:
        cmd: /tmp/k3s-install.sh
        creates: /usr/local/bin/k3s
      environment: "{{ {'INSTALL_K3S_VERSION': k3s_version} if k3s_version else {} }}"
      register: k3s_install

    - name: Clean up K3s installer script
      ansible.builtin.file:
        path: /tmp/k3s-install.sh
        state: absent

    - name: Restart k3s service if configuration changed
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: k3s_config.changed and not k3s_install.changed

    - name: Ensure k3s service is enabled and running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Fetch kubeconfig to local repository
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../../.kube/k3s-{{ inventory_hostname }}.yaml"
        flat: true
