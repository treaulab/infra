---
# Deploy Public Website (Caddy) to Azure VPS.
# Targets only the 'edge' group. Untrusted machines are completely ignored.
- name: Deploy Public Website (Caddy)
  hosts: edge
  become: true
  gather_facts: false
  vars:
    public_deploy_root: "{{ deploy_root | default('/opt/stacks') }}"
    public_caddy_root: "{{ public_deploy_root }}/caddy"
    public_website_root: "{{ public_deploy_root }}/website/src"
    public_site_ip: "{{ site_ip | default(ansible_host, true) | default('20.98.16.138', true) }}"
    deploy_user: "{{ ansible_user | default('root') }}"
  tasks:
    - name: Assert required configuration for public deploy
      ansible.builtin.assert:
        that:
          - domain | default('') | length > 0
          - acme_email | default('') | length > 0
        fail_msg: "Set domain and acme_email in inventory."

    - name: Ensure stack destination directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        mode: "0755"
      loop:
        - "{{ public_caddy_root }}"
        - "{{ public_website_root }}"

    - name: Install Caddy compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../stacks/public/caddy/compose.yml"
        dest: "{{ public_caddy_root }}/compose.yml"
        owner: "{{ deploy_user }}"
        mode: "0644"

    - name: Install Caddyfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../stacks/public/caddy/Caddyfile"
        dest: "{{ public_caddy_root }}/Caddyfile"
        owner: "{{ deploy_user }}"
        mode: "0644"
      notify: Reload Caddy

    - name: Render Caddy environment file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/public-caddy.env.j2"
        dest: "{{ public_caddy_root }}/.env"
        owner: "{{ deploy_user }}"
        mode: "0600"
      notify: Reload Caddy

    - name: Synchronize static website source
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../stacks/public/website/src/"
        dest: "{{ public_website_root }}/"
        owner: "{{ deploy_user }}"
        mode: "0644"

    - name: Pull and converge Caddy compose service
      ansible.builtin.command:
        cmd: docker compose pull && docker compose up -d --remove-orphans
        chdir: "{{ public_caddy_root }}"
      changed_when: true

    - name: Apply configuration reloads
      ansible.builtin.meta: flush_handlers

    - name: Verify public site availability
      ansible.builtin.uri:
        url: "https://{{ domain }}/"
        status_code: 200
        timeout: 10
      register: site_check
      until: site_check.status | default(0) == 200
      retries: 12
      delay: 5
      delegate_to: localhost
      become: false

  handlers:
    - name: Reload Caddy
      ansible.builtin.command:
        cmd: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
        chdir: "{{ public_caddy_root }}"
      changed_when: true
      failed_when: false
