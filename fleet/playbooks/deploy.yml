---
# Deploy Public Website (Caddy) to Azure VPS.
# Targets only the 'edge' group. Untrusted machines are completely ignored.
- name: Deploy Public Website (Caddy)
  hosts: edge
  become: true
  gather_facts: false
  vars:
    public_site_ip: "{{ site_ip | default(ansible_host, true) | default('20.98.16.138', true) }}"
    deploy_user: "{{ ansible_user | default('root') }}"
  tasks:
    - name: Assert required configuration for public deploy
      ansible.builtin.assert:
        that:
          - domain | default('') | length > 0
          - acme_email | default('') | length > 0
        fail_msg: "Set domain and acme_email in inventory."

    - name: Ensure website root directory exists
      ansible.builtin.file:
        path: "{{ deploy_root | default('/opt/stacks') }}/website/src"
        state: directory
        owner: "{{ deploy_user }}"
        mode: "0755"

    - name: Synchronize static website source
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../compose/public/website/src/"
        dest: "{{ deploy_root | default('/opt/stacks') }}/website/src/"
        owner: "{{ deploy_user }}"
        mode: "0644"

    - name: Converge Caddy compose stack via universal task
      ansible.builtin.include_tasks: tasks/compose_stack.yml
      vars:
        stack_name: caddy
        stack_src: compose/public/caddy
        deploy_user: "{{ deploy_user }}"
        stack_files:
          - src: compose/public/caddy/Caddyfile
        stack_env_content: |
          # Managed by Ansible (fleet/playbooks/deploy.yml). Do not edit on the host.
          DOMAIN={{ domain }}
          ACME_EMAIL={{ acme_email }}
          CADDY_VERSION={{ caddy_version | default('2.11') }}
          SITE_IP={{ public_site_ip }}

    - name: Verify public site availability
      ansible.builtin.uri:
        url: "https://{{ domain }}/"
        status_code: 200
        timeout: 10
      register: site_check
      until: site_check.status | default(0) == 200
      retries: 12
      delay: 5
      delegate_to: localhost
      become: false
