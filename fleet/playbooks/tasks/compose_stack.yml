---
# tasks/compose_stack.yml — Universal Docker Compose convergence task.
# Strictly enforces deployment to {{ deploy_root | default('/opt/stacks') }}/{{ stack_name }}
#
# Parameters:
#   stack_name: Required string. Name of the stack (e.g. "caddy", "immich")
#   stack_src:  Required string. Relative path in repo to compose folder (e.g. "compose/public/caddy")
#   stack_env_content: Optional string. Rendered into .env file (mode 0600)
#   stack_env_file: Optional string. Path in repo to .env file to copy (mode 0600)
#   stack_files: Optional list of dicts [{src: "...", dest: "...", mode: "0644"}]
#   deploy_user: Optional string. Target system user (defaults to ansible_user)

- name: Assert required stack variables are defined
  ansible.builtin.assert:
    that:
      - stack_name is defined
      - stack_name | length > 0
      - stack_src is defined
      - stack_src | length > 0
    fail_msg: "Both stack_name and stack_src must be provided."

- name: Enforce stack destination directory
  ansible.builtin.file:
    path: "{{ deploy_root | default('/opt/stacks') }}/{{ stack_name }}"
    state: directory
    owner: "{{ deploy_user | default(ansible_user) }}"
    mode: "0755"

- name: Install compose.yml for stack
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ stack_src }}/compose.yml"
    dest: "{{ deploy_root | default('/opt/stacks') }}/{{ stack_name }}/compose.yml"
    owner: "{{ deploy_user | default(ansible_user) }}"
    mode: "0644"

- name: Install additional stack files if configured
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ item.src }}"
    dest: "{{ deploy_root | default('/opt/stacks') }}/{{ stack_name }}/{{ item.dest | default(item.src | basename) }}"
    owner: "{{ deploy_user | default(ansible_user) }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ stack_files | default([]) }}"
  loop_control:
    label: "{{ item.dest | default(item.src | basename) }}"

- name: Render stack .env content if provided
  ansible.builtin.copy:
    dest: "{{ deploy_root | default('/opt/stacks') }}/{{ stack_name }}/.env"
    content: "{{ stack_env_content }}"
    owner: "{{ deploy_user | default(ansible_user) }}"
    mode: "0600"
  when: stack_env_content is defined and (stack_env_content | length > 0)

- name: Copy stack .env file if provided
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ stack_env_file }}"
    dest: "{{ deploy_root | default('/opt/stacks') }}/{{ stack_name }}/.env"
    owner: "{{ deploy_user | default(ansible_user) }}"
    mode: "0600"
  when: stack_env_file is defined and (stack_env_file | length > 0)

- name: Converge Docker Compose service
  ansible.builtin.command:
    cmd: docker compose pull && docker compose up -d --remove-orphans
    chdir: "{{ deploy_root | default('/opt/stacks') }}/{{ stack_name }}"
  changed_when: true
